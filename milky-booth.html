<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E5BD8">
<title>MILKY UP 부스 예약</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1E5BD8;--blue-d:#1645A8;--sky:#DCEAFF;--paper:#F3F7FC;--ink:#13224A;--muted:#56658A;--line:#CFDCEF;
  --straw:#FF5A87;--straw-d:#D1305F;--straw-l:#FFE4EC;
  --banana:#FFC234;--banana-d:#A87400;--banana-l:#FFF3CF;
  --choco:#8E5537;--choco-l:#F3E5DC;
  --leaf:#1F9D66;--leaf-l:#DDF4E8;--grey:#A9B4C6;
  --fd:'Do Hyeon','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --fb:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--fb);color:var(--ink);background:var(--paper);font-size:17px;line-height:1.55;-webkit-tap-highlight-color:transparent;word-break:keep-all}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--banana);outline-offset:3px}
.demo-bar{background:var(--banana-l);color:#5E4300;font-size:14px;text-align:center;padding:7px 14px;border-bottom:2px solid var(--banana)}
#errbar{position:fixed;left:0;right:0;top:0;z-index:80;background:var(--straw-d);color:#fff;text-align:center;padding:10px 14px;font-size:15px;display:none}
#errbar.show{display:block}
#app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
#app>*{flex:none}
#app>.p,#app>.qrp,#app>.a-main{flex:1 0 auto}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:60px;padding:0 24px;border:3px solid var(--ink);border-radius:18px;background:var(--blue);color:#fff;font-family:var(--fd);font-size:23px;line-height:1.1;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{background:var(--grey);cursor:not-allowed}
.btn.straw{background:var(--straw)}
.btn.choco{background:var(--choco)}
.btn.leaf{background:var(--leaf)}
.btn.ghost{background:#fff;color:var(--ink);min-height:50px;font-size:19px;border-width:2px;box-shadow:0 3px 0 var(--ink)}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:15px;padding:10px}

/* participant */
.p{width:100%;max-width:460px;margin:0 auto;padding:18px 22px calc(26px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;text-align:center}
.brand{display:flex;flex-direction:column;align-items:center}
.brand b{font-family:var(--fd);font-weight:400;font-size:27px;color:var(--blue);line-height:1.15}
.brand span{font-size:14px;color:var(--muted)}
.p h1{font-family:var(--fd);font-weight:400;font-size:clamp(30px,8.6vw,38px);line-height:1.2;margin:6px 0 6px}
.p .sub{color:var(--muted);margin:0 0 16px;max-width:30em}
.stack{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:auto;padding-top:10px}
.field{width:100%;text-align:left}
.field label{display:block;font-family:var(--fd);font-size:19px;margin:0 0 6px 4px}
.field input,.set-txt input{width:100%;height:60px;border:3px solid var(--ink);border-radius:16px;padding:0 18px;font-size:22px;font-family:var(--fb);color:var(--ink);background:#fff}
.field input:focus,.set-txt input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px var(--sky)}
.err{color:var(--straw-d);font-size:15px;min-height:1.5em;margin:6px 4px 0}
.notice{background:var(--banana-l);border:2px solid var(--banana);border-radius:14px;padding:9px 14px;font-size:15px;width:100%;margin:0 0 8px}
.since{font-size:16px;color:var(--muted);margin:0}
.since b{font-family:var(--fd);font-weight:400;color:var(--straw-d);font-size:21px}
.timer{font-family:var(--fd);font-size:64px;line-height:1;margin:2px 0 8px;color:var(--choco);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0 0 8px}
.chip{font-size:14px;border:2px solid var(--line);background:#fff;border-radius:99px;padding:4px 12px;color:var(--muted);line-height:1.4}
button.chip{border-color:var(--ink);color:var(--ink);font-family:var(--fd);font-size:16px;box-shadow:0 2px 0 var(--ink)}
.pfoot{margin-top:14px}

/* the milk carton */
.carton{--fill:var(--blue);--c:var(--blue);position:relative;width:min(56vw,220px,31vh);aspect-ratio:2/3;margin:12px auto 6px;flex:none;isolation:isolate}
.carton svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.carton .ink{stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
.carton .face{fill:#fff}
.carton .side1{fill:#E9F0FA}
.carton .side2{fill:#D7E2F2}
.carton .wave{fill:var(--fill);animation:wave 3.4s linear infinite}
.carton .fillg{transition:transform 1.5s cubic-bezier(.3,.7,.2,1)}
.carton .roof{font-family:var(--fd);font-size:17px;fill:var(--c)}
@keyframes wave{to{transform:translateX(100px)}}
.carton .lab{position:absolute;left:23%;width:54%;top:45%;height:37%;background:#fff;border:3px solid var(--ink);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 6px;overflow:hidden}
.lab small{font-size:12px;color:var(--muted);line-height:1.2}
.lab .big{font-family:var(--fd);font-size:clamp(40px,13vw,58px);line-height:.95;color:var(--c);font-variant-numeric:tabular-nums}
.lab .nm{font-family:var(--fd);font-size:18px;line-height:1.25;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lab .stamp{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap}
.st-waiting,.st-join{--fill:var(--blue);--c:var(--blue)}
.st-near{--fill:var(--banana);--c:var(--banana-d)}
.st-called{--fill:var(--straw);--c:var(--straw-d)}
.st-active{--fill:var(--choco);--c:var(--choco)}
.st-done{--fill:var(--leaf);--c:var(--leaf)}
.st-off{--fill:var(--grey);--c:var(--muted)}
.carton.st-called{animation:wobble 1.6s ease-in-out infinite}
.carton.st-called::before,.carton.st-called::after{content:"";position:absolute;left:50%;top:58%;width:125%;aspect-ratio:1;border-radius:50%;background:var(--straw-l);z-index:-1;animation:ring 1.8s ease-out infinite}
.carton.st-called::after{animation-delay:.9s}
@keyframes ring{from{transform:translate(-50%,-50%) scale(.5);opacity:1}to{transform:translate(-50%,-50%) scale(1.2);opacity:0}}
@keyframes wobble{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.carton.small{width:min(38vw,140px);margin-top:4px}
.carton.small .lab .big{font-size:34px}
.carton.small .lab .nm{font-size:14px}
.carton.small .lab small{font-size:10px}
.carton.small .lab .stamp{display:none}
.carton.big{width:min(78vw,38vh,400px)}
.carton.big .lab{left:19%;width:62%;top:38.5%;height:auto;aspect-ratio:1;padding:4%;border-radius:10px}
.dojang{position:absolute;right:-14%;top:20%;width:48%;aspect-ratio:1;border-radius:50%;border:4px solid var(--straw-d);color:var(--straw-d);background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--fd);font-size:clamp(17px,5.2vw,23px);line-height:1.05;transform:rotate(-14deg);box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 5px var(--straw-d);animation:stamp .45s cubic-bezier(.2,1.6,.4,1) .5s both}
@keyframes stamp{from{transform:rotate(-14deg) scale(1.8);opacity:0}to{transform:rotate(-14deg) scale(1);opacity:1}}

/* stars */
.stars{display:flex;gap:4px;justify-content:center;margin:8px 0 2px}
.star{width:58px;height:58px;border:0;background:none;padding:2px;border-radius:12px}
.star svg{width:100%;height:100%;transition:transform .15s}
.star path{fill:#fff;stroke:var(--ink);stroke-width:1.8;stroke-linejoin:round;transition:fill .15s}
.star.on path{fill:var(--banana)}
.star.on svg{transform:scale(1.08)}
.rate-lab{font-family:var(--fd);font-size:25px;min-height:1.4em;color:var(--blue);margin:0}

/* admin */
.a-top{background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;border-bottom:3px solid var(--ink);flex-wrap:wrap}
.a-brand{display:flex;align-items:center;gap:10px;font-family:var(--fd);font-size:25px;line-height:1.1}
.a-brand small{font-family:var(--fb);font-size:14px;background:rgba(255,255,255,.2);padding:3px 10px;border-radius:99px}
.a-tools{display:flex;gap:8px;flex-wrap:wrap}
.tbtn{background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:12px;padding:7px 14px;font-family:var(--fd);font-size:18px;box-shadow:0 3px 0 var(--ink)}
.tbtn.is-open{background:var(--leaf);color:#fff}
.tbtn.is-closed{background:var(--straw);color:#fff}
.a-main{width:100%;max-width:1280px;margin:0 auto;padding:18px 20px 48px}
.a-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:stretch;margin-bottom:12px}
.a-next{min-height:84px;font-size:28px;flex-wrap:wrap}
.a-next .nx{font-size:22px;background:rgba(255,255,255,.2);padding:3px 12px;border-radius:10px}
.a-sum{display:flex;gap:22px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:10px 22px;align-items:center}
.a-sum div{display:flex;flex-direction:column;line-height:1.15}
.a-sum b{font-family:var(--fd);font-weight:400;font-size:32px}
.a-sum span{font-size:13px;color:var(--muted);white-space:nowrap}
.auto-on{margin:0 0 12px;font-size:15px;color:var(--leaf);background:var(--leaf-l);border:2px solid var(--leaf);border-radius:12px;padding:6px 14px;display:inline-block}
.a-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:6px}
.col h2{font-family:var(--fd);font-weight:400;font-size:23px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.col h2 i{width:16px;height:22px;border-radius:3px 3px 2px 2px;background:var(--m);border:2px solid var(--ink);clip-path:polygon(0 30%,25% 0,75% 0,100% 30%,100% 100%,0 100%)}
.col h2 em{font-style:normal;color:var(--muted);font-size:19px}
.c-called{--m:var(--straw);--md:var(--straw-d)}
.c-active{--m:var(--choco);--md:var(--choco)}
.c-wait{--m:var(--blue);--md:var(--blue)}
.row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;align-items:center;background:#fff;border:2px solid var(--line);border-left:9px solid var(--m);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.r-no{font-family:var(--fd);font-size:32px;line-height:1;min-width:1.7em;text-align:center;color:var(--md)}
.r-nm{font-family:var(--fd);font-size:21px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-meta{font-size:14px;color:var(--muted)}
.r-meta .pos{color:var(--ink);margin-right:6px}
.r-acts{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.sbtn{border:2px solid var(--ink);background:#fff;border-radius:11px;padding:6px 13px;font-family:var(--fd);font-size:17px;box-shadow:0 2px 0 var(--ink)}
.sbtn:active{transform:translateY(2px);box-shadow:none}
.sbtn.pri{background:var(--blue);color:#fff}
.sbtn.warn{background:var(--straw);color:#fff}
.sbtn.quiet{border-color:var(--line);box-shadow:none;color:var(--muted)}
.row.late{background:var(--straw-l);border-color:var(--straw);border-left-color:var(--straw-d)}
.cut{margin-left:8px;color:var(--ink)}
.cut span{font-family:var(--fd);font-size:16px;color:var(--straw-d)}
.tag.nophone{color:var(--choco);font-family:var(--fb);font-size:12px;margin-left:8px;vertical-align:middle}
/* time-slot booking */
.jh{margin-top:10px}
.jform{width:100%;display:flex;flex-direction:column;gap:16px;text-align:left;margin-top:6px}
.party{display:flex;align-items:center;gap:8px}
.party output{font-family:var(--fd);font-size:34px;min-width:1.4ch;text-align:center;line-height:1}
.party span{font-family:var(--fd);font-size:20px}
.party small{color:var(--muted);font-size:14px;margin-left:8px}
.pbtn{width:52px;height:52px;border:3px solid var(--ink);border-radius:14px;background:#fff;font-family:var(--fd);font-size:28px;line-height:1;box-shadow:0 3px 0 var(--ink);flex:none}
.pbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.party.sm{gap:6px}.party.sm .pbtn{width:44px;height:44px;font-size:24px;border-width:2px}.party.sm output{font-size:26px}.party.sm span{font-size:17px}
.slotgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.slotgrid .empty{grid-column:1/-1}
.slot{display:flex;flex-direction:column;align-items:center;padding:8px 4px 7px;border:2px solid var(--ink);border-radius:14px;background:#fff;box-shadow:0 3px 0 var(--ink);line-height:1.2}
.slot b{font-family:var(--fd);font-weight:400;font-size:16px;color:var(--muted)}
.slot .t{font-family:var(--fd);font-size:25px;color:var(--ink);font-variant-numeric:tabular-nums}
.slot .l{font-size:13px;color:var(--blue)}
.slot.sel{background:var(--blue)}
.slot.sel b,.slot.sel .t,.slot.sel .l{color:#fff}
.slot:disabled{background:#EBF0F7;border-color:var(--line);box-shadow:none;cursor:not-allowed}
.slot:disabled b,.slot:disabled .t{color:var(--grey)}
.slot:disabled .l{color:var(--muted)}
.bookbar{position:sticky;bottom:0;padding:16px 0 calc(8px + env(safe-area-inset-bottom));background:linear-gradient(rgba(243,247,252,0),var(--paper) 26%)}
.bookbar .err{margin:0 4px 8px;min-height:0;background:#fff;border-radius:10px;padding:4px 10px}
.bookbar .err:empty{display:none}
.since b{font-variant-numeric:tabular-nums}
.a-head .nowcard{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:baseline;background:#fff;border:2px solid var(--line);border-left:9px solid var(--straw);border-radius:18px;padding:14px 18px;text-align:left}
.nowcard small{color:var(--muted);font-size:14px}
.nowcard b{font-family:var(--fd);font-weight:400;font-size:30px;line-height:1.15;margin-right:10px}
.nowcard b.nx2{font-size:22px}
.nowcard span{color:var(--muted);font-size:15px}
.slots-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:980px){.slots-grid{grid-template-columns:minmax(0,1fr)}}
.slotc{background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 14px 6px}
.slotc header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:6px}
.slotc header b{font-family:var(--fd);font-weight:400;font-size:23px}
.slotc .tm{font-family:var(--fd);font-size:19px;color:var(--muted);font-variant-numeric:tabular-nums}
.slotc .ph{font-size:13px;border-radius:99px;padding:1px 10px;border:2px solid currentColor}
.slotc.ph-now{border:3px solid var(--straw);box-shadow:0 0 0 4px var(--straw-l)}
.slotc.ph-now .ph{color:var(--straw-d)}
.slotc.ph-next{border-color:var(--banana)}
.slotc.ph-next .ph{color:var(--banana-d)}
.slotc.ph-past .ph{color:var(--muted)}
.cap{margin-left:auto;display:flex;align-items:center;gap:8px}
.cap i{width:84px;height:14px;border-radius:7px;background:var(--sky);position:relative;overflow:hidden;border:2px solid var(--ink)}
.cap i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--w);background:var(--blue)}
.cap em{font-style:normal;font-family:var(--fd);font-size:19px}
.cap small{font-size:13px;color:var(--muted)}
.lostc{border:3px solid var(--straw);margin-bottom:14px;background:var(--straw-l)}
.lostc header{flex-direction:column;align-items:flex-start;gap:2px}
.lostc .tm{font-family:var(--fb);font-size:14px}
.ph-full .cap i::after{background:var(--straw)}
.ph-full .cap em{color:var(--straw-d)}
.brow{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;padding:8px 4px;border-top:1px solid var(--line)}
.brow .bn{font-family:var(--fd);font-size:20px}
.brow .bp{font-family:var(--fd);font-size:18px;color:var(--blue)}
.brow .bs{font-size:14px;color:var(--muted)}
.bs.come{color:var(--straw-d)}.bs.act{color:var(--choco)}.bs.done{color:var(--leaf)}
.brow .ba{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.brow .sbtn{font-size:16px;padding:5px 11px}
.brow.late{background:var(--straw-l);border-radius:10px}
.slotc .empty{padding:10px;font-size:14px;border-width:1px;margin:0 0 6px}
.pastwrap{margin-top:18px}
.pastwrap summary{font-family:var(--fd);font-size:21px;cursor:pointer;padding:8px 0}
.walk select{height:56px;border:3px solid var(--ink);border-radius:14px;padding:0 10px;font-size:18px;font-family:var(--fb);color:var(--ink);background:#fff;min-width:0;flex:1 1 210px}
.walk-in{flex-wrap:wrap;align-items:center}
.walk input{flex:2 1 200px}
.timein{height:50px;border:2px solid var(--ink);border-radius:12px;padding:0 10px;font-size:20px;font-family:var(--fd);color:var(--ink);background:#fff}
.lunch{grid-column:1/-1;margin:4px 0;text-align:center;font-family:var(--fd);font-size:17px;color:var(--choco);background:var(--choco-l);border:2px dashed var(--choco);border-radius:12px;padding:6px 10px}
.set-row.col{flex-direction:column;align-items:stretch;gap:8px}
.trange{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.trange .timein{height:48px;font-size:18px;min-width:150px;flex:1 1 150px}
.trange .tog{margin-right:4px}
.trange span{font-family:var(--fd);font-size:20px}
.sched{background:var(--sky);border-radius:10px;padding:8px 12px;color:var(--ink);font-size:15px;margin:6px 0}
.sched.bad{background:var(--straw-l);color:var(--straw-d)}
.q-nophone{font-family:var(--fd);font-size:clamp(18px,2.2vw,22px);color:var(--choco);margin:14px 0 0}
.walk{display:grid;grid-template-columns:minmax(0,1fr);gap:6px 20px;align-items:center;background:#fff;border:2px solid var(--line);border-left:9px solid var(--choco);border-radius:18px;padding:12px 16px;margin:0 0 16px}
.walk label b{font-family:var(--fd);font-weight:400;font-size:22px;display:block;line-height:1.25}
.walk label small{color:var(--muted);font-size:14px;display:block;line-height:1.4}
.walk-in{display:flex;gap:10px}
.walk input{flex:1;min-width:0;height:56px;border:3px solid var(--ink);border-radius:14px;padding:0 16px;font-size:21px;font-family:var(--fb);color:var(--ink);background:#fff}
.walk input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px var(--sky)}
.walk .btn{width:auto;flex:none;min-height:56px;font-size:21px;padding:0 24px;background:var(--choco)}
.walk .err{grid-column:1/-1;margin:0}
.walk .err:empty{display:none}
@media (max-width:980px){.walk{grid-template-columns:minmax(0,1fr)}}
@media (max-width:420px){.walk .btn{padding:0 16px;font-size:19px}}
.rule{font-size:14px;color:var(--straw-d);background:var(--straw-l);border-radius:10px;padding:4px 12px;margin:-6px 0 12px}
.rule:empty{display:none}
.late-tag{display:none;color:var(--straw-d);font-family:var(--fd);font-size:15px;margin-left:4px}
.row.late .late-tag{display:inline}
.empty{color:var(--muted);border:2px dashed var(--line);border-radius:14px;padding:20px 14px;text-align:center;font-size:15px}
.rec{margin-top:26px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:4px 18px}
.rec summary{font-family:var(--fd);font-size:22px;padding:12px 0;cursor:pointer}
.rec summary em{font-style:normal;font-family:var(--fb);font-size:15px;color:var(--muted);margin-left:8px}
.rec-in{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;padding:4px 0 18px}
.dist h3{font-family:var(--fd);font-weight:400;font-size:18px;margin:0 0 8px}

const TIME_DEFAULTS = { capacity: 4, slots: 11, startTime: "10:00", endTime: "16:30", useBreak: true, breakStart: "12:00", breakEnd: "13:00", slotMin: 30, maxParty: 2, notifyBefore: 5, noShowMin: 3, cancelMin: 10 };
const DEFAULT_CFG = () => ({ sid: newSid(), open: true, ...TIME_DEFAULTS, name: "MILKY UP", sub: "우유팩 업사이클링 키트 만들기", cfgVer: 9 });

/* ========================= 소리 · 진동 · 알림 · 화면 켜짐 ========================= */
let AC = null, WL = null;
function unlockAudio(){
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
    const o = AC.createOscillator(), g = AC.createGain(); g.gain.value = 0.0001;
    o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime + 0.05);
  } catch(e){}
}
const audioOn = () => !!AC && AC.state === "running";
function chime(notes, reps = 1){
  if (!AC) return; try { AC.resume(); } catch(e){}
  let t = AC.currentTime + 0.05;
  for (let r = 0; r < reps; r++){
    for (const [f, d] of notes){
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.55, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + 0.05); t += d * 0.8;
    }
    t += 0.55;
  }
}
const DINGDONG = [[784, .55], [659, .55], [523, .9]];
const NEARTONE = [[659, .35], [880, .55]];

async function notify(title, body){
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  try { const reg = await navigator.serviceWorker?.getRegistration(location.href); if (reg){ await reg.showNotification(title, { body, tag: "milky", renotify: true, vibrate: [300, 120, 300] }); return; } } catch(e){}

}
async function keepAwake(on){

/* ========================= 저장소: Firestore ========================= */
/* 구조: milkyBooth/config (설정) · milkyBooth/s_<sid> (예약 번호·회차별 예약 인원) · milkyBooth/s_<sid>/tickets/<id> (예약 한 건) */
const fullErr = () => { const e = new Error("full"); e.code = "full"; return e; };
async function makeFirestore(){
  const { initializeApp } = await import(`${FB}/firebase-app.js`);
  const F = await import(`${FB}/firebase-firestore.js`);
  const app = initializeApp(FIREBASE_CONFIG, "milky-booth");
  const db = F.getFirestore(app);
  const cfgRef = F.doc(db, ROOT, "config");
  const sRef = sid => F.doc(db, ROOT, "s_" + sid);
  const tCol = sid => F.collection(db, ROOT, "s_" + sid, "tickets");
  const conv = snap => { const d = snap.data({ serverTimestamps: "estimate" }); for (const k of TS_KEYS) if (d[k] && d[k].toMillis) d[k] = d[k].toMillis(); d.id = snap.id; return d; };
  const prep = patch => { const o = {}; for (const [k, v] of Object.entries(patch)) o[k] = v === NOW ? F.serverTimestamp() : v === INC ? F.increment(1) : v; return o; };
  return {
    async ensureConfig(){ await F.runTransaction(db, async tx => { const s = await tx.get(cfgRef); if (!s.exists()) tx.set(cfgRef, DEFAULT_CFG()); }); },
    watchConfig(cb, err){ return F.onSnapshot(cfgRef, s => cb(s.exists() ? { ...DEFAULT_CFG(), ...s.data() } : null), err); },
    setConfig(p){ return F.setDoc(cfgRef, p, { merge: true }); },
    watchSession(sid, cb, err){ return F.onSnapshot(sRef(sid), s => cb(s.exists() ? { used: {}, ...s.data() } : { used: {} }), err); },
    watchAll(sid, cb, err){ return F.onSnapshot(tCol(sid), qs => cb(qs.docs.map(conv)), err); },
    watchTicket(sid, id, cb, err){ return F.onSnapshot(F.doc(tCol(sid), id), s => cb(s.exists() ? conv(s) : null), err); },
    async book(sid, { name, party, slot, walkin }, cap){
      const tref = F.doc(tCol(sid));
      const no = await F.runTransaction(db, async tx => {
        const s = await tx.get(sRef(sid)); const d = s.exists() ? s.data() : {};
        const used = (d.used && d.used[slot]) || 0;
        if (used + 1 > cap) throw fullErr();            // 정원은 팀 수로 셈(한 예약 = 한 팀)
        const n = (d.counter || 0) + 1;
        tx.set(sRef(sid), { counter: n, used: { [slot]: used + 1 } }, { merge: true });
        tx.set(tref, prep({ no: n, name, party, slot, status: "reserved", walkin: !!walkin, createdAt: NOW, updatedAt: NOW, callCount: 0, rating: null }));
        return n;
      });
      return { id: tref.id, no };
    },
    update(sid, id, patch){ return F.updateDoc(F.doc(tCol(sid), id), prep({ ...patch, updatedAt: NOW })); },
    setUsed(sid, map){ return F.setDoc(sRef(sid), { used: map }, { merge: true }); },
    release(sid, id, status, from){
      const r = F.doc(tCol(sid), id);
      return F.runTransaction(db, async tx => {
        const s = await tx.get(sRef(sid)); const t = await tx.get(r);
        if (!t.exists()) return false; const d = t.data();
        if (!from.includes(d.status)) return false;
        const used = (s.exists() && s.data().used && s.data().used[d.slot]) || 0;
        tx.set(sRef(sid), { used: { [d.slot]: Math.max(0, used - 1) } }, { merge: true });
        tx.update(r, prep({ status, updatedAt: NOW }));
        return true;
      });
    }
  };
}

/* ========================= 저장소: 체험판(이 브라우저 안) ========================= */
function makeLocal(){
  const KEY = "milkyDemoDB2"; let mem = null; const subs = new Set();
  const blank = () => ({ cfg: null, s: {} });
  const read = () => { try { const v = localStorage.getItem(KEY); return v ? JSON.parse(v) : (mem ? JSON.parse(JSON.stringify(mem)) : blank()); } catch(e){ return mem ? JSON.parse(JSON.stringify(mem)) : blank(); } };
  const fire = () => { const db = read(); subs.forEach(f => { try { f(db); } catch(e){ console.error(e); } }); };
  const write = db => { mem = db; try { localStorage.setItem(KEY, JSON.stringify(db)); } catch(e){} setTimeout(fire, 0); };
  addEventListener("storage", e => { if (e.key === KEY) fire(); });
  const sub = f => { subs.add(f); setTimeout(() => f(read()), 0); return () => subs.delete(f); };
  const sess = (db, sid) => db.s[sid] || (db.s[sid] = { counter: 0, used: {}, t: {} });
  const apply = (o, patch) => { for (const [k, v] of Object.entries(patch)) o[k] = v === NOW ? Date.now() : v === INC ? (o[k] || 0) + 1 : v; };
  return {
    async ensureConfig(){ const db = read(); if (!db.cfg){ db.cfg = DEFAULT_CFG(); write(db); } },
    watchConfig(cb){ return sub(db => cb(db.cfg ? { ...DEFAULT_CFG(), ...db.cfg } : null)); },
    async setConfig(p){ const db = read(); db.cfg = { ...(db.cfg || DEFAULT_CFG()), ...p }; write(db); },
    watchSession(sid, cb){ return sub(db => { const s = db.s[sid]; cb({ counter: s?.counter || 0, used: { ...(s?.used || {}) } }); }); },
    watchAll(sid, cb){ return sub(db => cb(Object.values(db.s[sid]?.t || {}).map(t => ({ ...t })))); },
    watchTicket(sid, id, cb){ return sub(db => { const t = db.s[sid]?.t?.[id]; cb(t ? { ...t } : null); }); },
    async book(sid, { name, party, slot, walkin }, cap){
      const db = read(); const s = sess(db, sid);
      const used = s.used[slot] || 0; if (used + 1 > cap) throw fullErr();
      const no = ++s.counter; s.used[slot] = used + 1;
      const id = "t" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); const now = Date.now();
      s.t[id] = { id, no, name, party, slot, status: "reserved", walkin: !!walkin, createdAt: now, updatedAt: now, callCount: 0, rating: null };
      write(db); return { id, no };
    },
    async update(sid, id, patch){ const db = read(); const t = db.s[sid]?.t?.[id]; if (!t) return; apply(t, { ...patch, updatedAt: NOW }); write(db); },
    async setUsed(sid, map){ const db = read(); const s = sess(db, sid); s.used = { ...s.used, ...map }; write(db); },
    async release(sid, id, status, from){
      const db = read(); const s = db.s[sid]; const t = s?.t?.[id];
      if (!t || !from.includes(t.status)) return false;
      s.used[t.slot] = Math.max(0, (s.used[t.slot] || 0) - 1);
      apply(t, { status, updatedAt: NOW }); write(db); return true;
    }
  };
}

}

function setFill(level){ const f = $("#ct-fill"); if (f) f.style.transform = `translateY(${(290 - clamp(level, 0, 1) * 190 + 4).toFixed(1)}px)`; }
function setRoof(name){

function checkAlerts(){

  if (t.status === "reserved" && t.slot <= cfg.slots){

    }

      chime(DINGDONG, 3); buzz([450, 150, 450, 150, 900]);

    }

      me.alerted = t.callCount; saveMe();
      chime(DINGDONG, 2); buzz([450, 150, 450]);
      notify("부스에서 부르고 있어요!", `${t.slot}회차 ${t.name}님, 부스로 와 주세요.`);

}
async function reserve(){

  const btn = $("#joinBtn"); btn.disabled = true; btn.textContent = "예약하는 중…";
  const sid = cfg.sid;
  for (let i = 0; i < 5; i++){
    try {
      const r = await B.book(sid, { name, party, slot }, cfg.capacity);
      const st = slotStart(cfg, slot), now = Date.now();
      P.me = { sid, id: r.id, no: r.no, slot, party, name, nearDone: now >= st - cfg.notifyBefore * 60000, startDone: now >= st, alerted: 0, ratingStep: false, rated: false };

      if (e && e.code === "permission-denied"){ onErr(e); break; }
      await sleep(300 + Math.random() * 900);
    }
  }
  btn.textContent = ""; updateP();
  setText("#nm-err", "예약하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.");
}

    expiring.add(t.id);
    B.release(cfg.sid, t.id, "expired", ["reserved"])
      .then(ok => { if (ok) toast(`${t.slot}회차 ${t.name}(${t.party || 1}명): ${cfg.cancelMin}분 안에 오지 않아 예약을 취소했어요`); })
      .catch(onErr).finally(() => setTimeout(() => expiring.delete(t.id), 3000));
  });
}
function tickA(){
  if (!A.cfg) return;
  const now = Date.now();
  if (`${curSlot(A.cfg, now)}:${nextSlot(A.cfg, now)}` !== A.key) renderA();
  paintTimers(); checkExpire();
}
async function addWalkin(){
  const cfg = A.cfg, inp = $("#wk-name"), btn = $("#wk-btn");
  const name = inp.value.trim().replace(/\s+/g, " "), slot = +$("#wk-slot").value, party = A.wk.party;
  setText("#wk-err", "");
  if (!name){ setText("#wk-err", "이름을 적어 주세요."); inp.focus(); return; }
  if (!slot){ setText("#wk-err", "예약할 수 있는 회차가 없어요."); return; }
  btn.disabled = true;
  try {
    await B.book(cfg.sid, { name, party, slot, walkin: true }, cfg.capacity);
    inp.value = ""; toast(`${slot}회차 ${hm(slotStart(cfg, slot))}에 ${name} ${party}명 예약했어요`);
    A.wk.party = 1;
  } catch(e){
    setText("#wk-err", e && e.code === "full" ? `${slot}회차는 이미 ${cfg.capacity}팀이 다 찼어요. 다른 회차를 골라 주세요.` : "예약하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.");
  }
  btn.disabled = false; inp.focus(); renderWalkSelect();
}
function openFinish(t){
  let rate = 0;
  const m = modal(`<h3>${t.slot}회차 ${esc(t.name)} 체험 완료</h3>
    <p class="msub">${t.walkin ? "체험한 사람이 이 화면에서 직접 별을 눌러 만족도를 남겨요." : "휴대폰에서 별점을 못 남겼을 때 써요."} 별점 없이 완료할 수도 있어요.</p>
    <div class="stars" role="radiogroup" aria-label="만족도">${[1,2,3,4,5].map(i => `<button type="button" class="star" role="radio" aria-checked="false" aria-label="별 ${i}개" data-r="${i}">${STAR}</button>`).join("")}</div>
    <p class="rate-lab" id="f-lab"></p>
    <div class="mbtns"><button class="btn ghost" data-x="close">닫기</button><button class="btn leaf" data-x="ok">완료 처리</button></div>`);
  m.addEventListener("click", async e => {
    const st = e.target.closest("[data-r]");
    if (st){ rate = +st.dataset.r; m.querySelectorAll(".star").forEach((b, i) => { b.classList.toggle("on", i < rate); b.setAttribute("aria-checked", String(i + 1 === rate)); }); setText("#f-lab", RATE_LAB[rate]); return; }
    const x = e.target.closest("[data-x]"); if (!x) return;
    closeModal(); if (x.dataset.x !== "ok") return;
    await safe(B.update(A.cfg.sid, t.id, { status: "done", doneAt: NOW, rating: rate || null }));
    toast(`${t.slot}회차 ${t.name} 체험 완료${rate ? ` (별점 ${rate})` : ""}`);
  });
}
function exportCSV(){
  const cfg = A.cfg;
  const L = { reserved: "예약", active: "체험 중", done: "완료", expired: "시간 초과 취소", cancelled: "취소" };
  const rows = [["예약번호","회차","회차 시각","이름","인원","예약 방법","상태","예약한 시각","체험 시작","체험 완료","별점"]];
  [...A.all].sort((a, b) => a.slot - b.slot || a.no - b.no).forEach(t => rows.push([t.no, t.slot, hm(slotStart(cfg, t.slot)), t.name, t.party || 1, t.walkin ? "현장 등록" : "QR", L[t.status] || t.status, hms(t.createdAt), hms(t.startedAt), hms(t.doneAt), t.rating || ""]));
  const cell = v => { let s = String(v ?? ""); if (/^[=+\-@]/.test(s)) s = "'" + s; return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const text = "﻿" + rows.map(r => r.map(cell).join(",")).join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: "text/csv;charset=utf-8" }));
  a.download = `${cfg.name}_${cfg.sid}.csv`; document.body.appendChild(a); a.click(); a.remove();
  toast("CSV 파일을 내려받았어요");
}
const STEPS = { slots: [1, 40, 1], capacity: [1, 30, 1], maxParty: [1, 10, 1], notifyBefore: [0, 30, 1], noShowMin: [1, 15, 1], cancelMin: [0, 30, 1] };
function openSettings(){
  const c = { ...A.cfg };
  const stepRow = (k, title, hint) => `<div class="set-row"><div><b>${title}</b><small>${hint}</small></div><div class="step"><button type="button" data-step="${k}" data-d="-1" aria-label="${title} 줄이기">−</button><output id="s-${k}">${c[k]}</output><button type="button" data-step="${k}" data-d="1" aria-label="${title} 늘리기">+</button></div></div>`;
  const recalc = () => {
    c.slotMin = fitSlotMin(c);
    const ok = c.slotMin >= 5;
    setText("#s-span", ok ? scheduleText(c) : "운영 시간이 모자라요. 회차 수를 줄이거나 운영 시간을 늘려 주세요.");
    $("#s-span").classList.toggle("bad", !ok); $('[data-x="save"]').disabled = !ok;
  };
  const m = modal(`<h3>부스 설정</h3>
    <div class="set-row col"><div><b>운영 시간</b><small>첫 회차 시작부터 마지막 회차 끝까지예요.</small></div><div class="trange"><input type="time" id="s-start" class="timein" value="${esc(c.startTime)}"><span>~</span><input type="time" id="s-end" class="timein" value="${esc(c.endTime)}"></div></div>
    <div class="set-row col"><div><b>점심시간</b><small>이 시간에는 회차를 넣지 않아요.</small></div><div class="trange"><input type="checkbox" class="tog" id="s-brk" ${c.useBreak ? "checked" : ""} aria-label="점심시간 사용"><input type="time" id="s-bs" class="timein" value="${esc(c.breakStart)}"><span>~</span><input type="time" id="s-be" class="timein" value="${esc(c.breakEnd)}"></div></div>
    ${stepRow("slots", "회차 수", "운영 시간을 회차 수로 나눠 회차 길이를 자동으로 정해요.")}
    <p class="msub small sched" id="s-span"></p>
    ${stepRow("capacity", "회차당 정원(팀)", "한 회차에 체험할 수 있는 팀 수예요. 예약 한 건이 한 팀이에요.")}
    ${stepRow("maxParty", "한 팀 최대 인원", "가족이나 친구와 함께 예약할 때 한 팀에 들어갈 수 있는 최대 인원이에요.")}
    ${stepRow("notifyBefore", "시작 전 알림(분)", "회차 시작 몇 분 전에 미리 알릴지 정해요. 0이면 시작할 때만 알려요.")}
    ${stepRow("noShowMin", "미도착 표시(분)", "시작 뒤 이 시간이 지나도 안 오면 빨갛게 표시해요.")}
    ${stepRow("cancelMin", "자동 취소(분)", "시작 뒤 이 시간 안에 오지 않으면 예약을 취소하고 자리를 돌려놓아요. 0이면 꺼져요.")}
    <div class="set-txt"><label>부스 이름<input id="s-name" maxlength="16" value="${esc(c.name)}"></label><label>한 줄 소개<input id="s-sub" maxlength="30" value="${esc(c.sub)}"></label></div>
    <div class="mbtns"><button class="btn ghost" data-x="close">닫기</button><button class="btn" data-x="save">저장</button></div>
    <hr>
    <div class="set-more"><button class="sbtn" data-act="csv">결과 CSV 내려받기</button><button class="sbtn warn" data-act="newSession">예약 전체 초기화</button></div>
    <p class="msub small">예약이 있을 때 운영 시간이나 회차 수를 바꾸면, 이미 예약한 회차의 시각도 함께 바뀌어요. 예약 전체 초기화는 행사 전에 시험 예약을 지울 때 써요.</p>`);
  const bindT = (id, k) => $(id).addEventListener("input", e => { if (e.target.value){ c[k] = e.target.value; recalc(); } });
  bindT("#s-start", "startTime"); bindT("#s-end", "endTime"); bindT("#s-bs", "breakStart"); bindT("#s-be", "breakEnd");
  $("#s-brk").addEventListener("change", e => { c.useBreak = e.target.checked; recalc(); });
  recalc();
  m.addEventListener("click", e => {
    const s = e.target.closest("[data-step]");
    if (s){ const k = s.dataset.step, [mn, mx, st] = STEPS[k]; c[k] = clamp((+c[k] || 0) + st * +s.dataset.d, mn, mx); $("#s-" + k).textContent = c[k]; recalc(); return; }
    const x = e.target.closest("[data-x]"); if (!x || x.disabled) return;
    if (x.dataset.x === "close"){ closeModal(); return; }
    const patch = { startTime: c.startTime, endTime: c.endTime, useBreak: !!c.useBreak, breakStart: c.breakStart, breakEnd: c.breakEnd, slots: c.slots, slotMin: c.slotMin, capacity: c.capacity, maxParty: c.maxParty, notifyBefore: c.notifyBefore, noShowMin: c.noShowMin, cancelMin: c.cancelMin, name: $("#s-name").value.trim() || "MILKY UP", sub: $("#s-sub").value.trim() };
    closeModal(); safe(B.setConfig(patch)).then(() => toast("설정을 저장했어요")).catch(() => {});
  });
}
const AACT = {
  async toggleOpen(){ const willOpen = !A.cfg.open; await safe(B.setConfig({ open: willOpen })); toast(willOpen ? "예약을 다시 받아요" : "예약을 마감했어요"); },
  qr(){ location.hash = "#qr"; },
  settings(){ openSettings(); },
  logout(){ store.del("milkyAdmin"); location.hash = ""; },
  wkParty(d){ A.wk.party = clamp(A.wk.party + +d, 1, A.cfg.maxParty); renderWalkSelect(); },
  async arrive(id){ const t = findT(id); await safe(B.update(A.cfg.sid, id, { status: "active", startedAt: NOW })); toast(`${t.slot}회차 ${t.name} ${t.party || 1}명 체험을 시작했어요`); },
  async recall(id){ const t = findT(id); await safe(B.update(A.cfg.sid, id, { callCount: INC, lastCallAt: NOW })); toast(`${t.name}에게 다시 알렸어요`); },
  finishT(id){ const t = findT(id); if (t) openFinish(t); },
  async cancelT(id){
    const t = findT(id);
    if (!await ask(`${t.slot}회차 ${esc(t.name)} 예약을 취소할까요?`, `이 회차에 1팀 자리가 다시 생겨요. 휴대폰으로 예약한 사람이면 그 화면의 예약도 사라져요.`, "예약 취소", "straw")) return;
    try { await B.release(A.cfg.sid, id, "cancelled", ["reserved", "active"]); toast("예약을 취소했어요"); } catch(e){ onErr(e); }
  },
  csv(){ exportCSV(); },
  async newSession(){
    closeModal();
    if (!await ask("예약을 전체 초기화할까요?", "모든 회차의 예약이 비워지고 처음부터 다시 받아요. 기록이 필요하면 먼저 CSV를 받아 두세요.", "전체 초기화", "straw")) return;
    await safe(B.setConfig({ sid: newSid() })); toast("예약을 초기화했어요");
  }
};

/* ========================= QR 포스터 ========================= */
function qrSVG(text){
  if (!window.qrcode) return `<img src="https://api.qrserver.com/v1/create-qr-code/?size=600x600&margin=0&data=${encodeURIComponent(text)}" alt="체험 예약 QR 코드" style="width:100%;height:100%;display:block">`;
  const q = qrcode(0, "M"); q.addData(text); q.make();
  const n = q.getModuleCount(); let d = "";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c} ${r}h1v1h-1z`;
  return `<svg viewBox="-1 -1 ${n + 2} ${n + 2}" role="img" aria-label="체험 예약 QR 코드" shape-rendering="crispEdges" style="width:100%;height:100%;display:block"><rect x="-1" y="-1" width="${n + 2}" height="${n + 2}" fill="#fff"/><path d="${d}" fill="#0E1A3A"/></svg>`;
}

  const url = location.origin + location.pathname;
  $("#app").innerHTML = demoBar() + `<main class="qrp">
    ${carton("st-waiting big")}

      <li>화면을 켜 둔 채 기다려요</li>
      <li id="q-step3">시작 알림이 오면 부스로 와요</li>
      <li>체험이 끝나면 별점을 남겨요</li>
    </ol>
    <p class="q-nophone">휴대폰이 없으면 부스 선생님께 이름을 말해 주세요.</p>
    <p class="q-url">${esc(url)}</p>
    <div class="q-btns no-print"><button class="btn ghost" data-act="print">인쇄하기</button><button class="btn" data-act="back">관리자 화면으로</button></div>
  </main>`;
  $("#ct .lab").innerHTML = qrSVG(url);
  requestAnimationFrame(() => setFill(.58));
  const u = B.watchConfig(cfg => { if (!cfg) return; setRoof(cfg.name); setText("#q-sub", cfg.sub); setText("#q-step3", cfg.cancelMin > 0 ? `시작 알림이 오면 ${cfg.cancelMin}분 안에 부스로 와요` : "시작 알림이 오면 부스로 와요"); }, onErr);
  cleanup.push(u);
}

}
