<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>점심방송 신청곡 · 6-1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --stage:#0E3B43;
  --stage-2:#12505A;
  --stage-3:#175E69;
  --paper:#FFF9F0;
  --ink:#0B2126;
  --onair:#FF3D7F;
  --butter:#FFD166;
  --mint:#7BE0C0;
  --muted:#7FA0A5;
  --line:rgba(255,249,240,.16);
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--stage);
  background-image:
    radial-gradient(1200px 400px at 50% -10%, var(--stage-3), transparent 70%);
  color:var(--paper);
  font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;
  font-size:16px;line-height:1.5;
  padding-bottom:64px;
  min-height:100vh;
}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.display{font-family:"Black Han Sans",Pretendard,sans-serif;font-weight:400;letter-spacing:-.01em}

/* ── 헤더 / ON AIR ───────────────────────── */
header{
  position:sticky;top:0;z-index:40;
  background:rgba(14,59,67,.92);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.bar{display:flex;align-items:center;gap:10px;padding:10px 0}
.lamp{
  display:inline-flex;align-items:center;gap:7px;
  padding:5px 11px 5px 9px;border-radius:999px;
  background:var(--onair);color:#fff;
  font-family:"JetBrains Mono",monospace;font-weight:700;font-size:11px;letter-spacing:.14em;
  box-shadow:0 0 0 0 rgba(255,61,127,.55);
  animation:pulse 2.4s infinite;
}
.lamp.off{background:#2A5A62;color:var(--muted);animation:none;box-shadow:none}
.lamp b{width:7px;height:7px;border-radius:50%;background:#fff;display:block}
.lamp.off b{background:var(--muted)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,61,127,.5)}70%{box-shadow:0 0 0 12px rgba(255,61,127,0)}100%{box-shadow:0 0 0 0 rgba(255,61,127,0)}}
@media (prefers-reduced-motion:reduce){.lamp{animation:none}}
.title{font-size:15px;letter-spacing:-.02em}
.spacer{flex:1}
.me{font-size:12px;color:var(--butter);font-weight:600;white-space:nowrap}
.icon-btn{
  width:38px;height:38px;border-radius:10px;border:1px solid var(--line);
  background:transparent;color:var(--muted);font-size:16px;cursor:pointer;
  display:grid;place-items:center;
}
.icon-btn:hover{color:var(--paper);border-color:var(--paper)}

/* ── 지금 나오는 곡 ───────────────────────── */
.now{
  margin:16px 0;padding:16px;border-radius:var(--r);
  background:linear-gradient(135deg,#FF3D7F,#FF7A4D);
  display:flex;gap:14px;align-items:center;
  box-shadow:0 10px 30px rgba(255,61,127,.22);
}
.now .disc{
  width:66px;height:66px;border-radius:50%;flex:none;object-fit:cover;
  border:4px solid rgba(0,0,0,.28);
  animation:spin 6s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.now .disc{animation:none}}
.now .lbl{font-size:10px;letter-spacing:.2em;opacity:.85;font-family:"JetBrains Mono",monospace;font-weight:700}
.now .t{font-size:19px;line-height:1.25;margin-top:3px}
.now .a{font-size:13px;opacity:.9}

/* ── 검색 ────────────────────────────────── */
.panel{
  background:rgba(255,249,240,.06);border:1px solid var(--line);
  border-radius:var(--r);padding:14px;margin:16px 0;
}
.panel h2{margin:0 0 10px;font-size:13px;letter-spacing:.1em;color:var(--butter);font-family:"JetBrains Mono",monospace;font-weight:700}
.searchrow{display:flex;gap:8px}
input[type=text]{
  flex:1;min-width:0;height:48px;padding:0 14px;border-radius:11px;
  border:1px solid var(--line);background:rgba(0,0,0,.22);color:var(--paper);
  font-size:16px;font-family:inherit;
}
input::placeholder{color:var(--muted)}
input:focus,button:focus-visible,select:focus{outline:2px solid var(--butter);outline-offset:2px}
.btn{
  height:48px;padding:0 18px;border-radius:11px;border:none;cursor:pointer;
  background:var(--butter);color:var(--ink);font-weight:800;font-size:15px;font-family:inherit;
  white-space:nowrap;
}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--paper);font-weight:600}
.btn.pink{background:var(--onair);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}

.results{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.res{
  display:flex;gap:11px;align-items:center;padding:8px;border-radius:11px;
  background:rgba(0,0,0,.2);
}
.res img{width:48px;height:48px;border-radius:7px;flex:none;object-fit:cover;background:#0a2226}
.res .meta{flex:1;min-width:0}
.res .t{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .a{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{
  width:40px;height:40px;flex:none;border-radius:10px;border:1px solid var(--line);
  background:transparent;color:var(--paper);cursor:pointer;font-size:15px;display:grid;place-items:center;
}
.mini.add{background:var(--mint);color:var(--ink);border:none;font-weight:800}

/* ── 큐시트 ──────────────────────────────── */
.cuehead{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px}
.cuehead h2{margin:0;font-size:22px}
.cuehead .cnt{font-size:12px;color:var(--muted)}
.sorts{margin-left:auto;display:flex;gap:6px}
.chip{
  padding:6px 12px;border-radius:999px;border:1px solid var(--line);
  background:transparent;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;
}
.chip.on{background:var(--paper);color:var(--ink);border-color:var(--paper)}

.cue{display:flex;flex-direction:column;gap:7px}
.row{
  display:flex;align-items:center;gap:11px;padding:9px;border-radius:12px;
  background:rgba(255,249,240,.055);border:1px solid transparent;position:relative;overflow:hidden;
}
.row.playing{border-color:var(--onair);background:rgba(255,61,127,.12)}
.row.done{opacity:.42}
.row .no{font-size:12px;color:var(--muted);width:22px;text-align:right;flex:none}
.row img{width:46px;height:46px;border-radius:7px;flex:none;object-fit:cover;background:#0a2226}
.row .meta{flex:1;min-width:0}
.row .t{font-size:14.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .a{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .by{font-size:11px;color:var(--mint);margin-top:2px}
.row .by .msg{color:var(--muted)}
.heart{
  flex:none;min-width:52px;height:40px;border-radius:11px;border:1px solid var(--line);
  background:transparent;color:var(--muted);cursor:pointer;font-size:12px;font-weight:800;
  display:flex;align-items:center;justify-content:center;gap:4px;font-family:inherit;
}
.heart.on{background:var(--onair);border-color:var(--onair);color:#fff}
.stamp{
  position:absolute;right:64px;top:50%;
  transform:translateY(-50%) rotate(-12deg);
  border:2.5px solid var(--butter);color:var(--butter);
  padding:1px 8px;border-radius:5px;font-size:11px;font-weight:800;letter-spacing:.08em;
  pointer-events:none;
}
.empty{text-align:center;padding:38px 16px;color:var(--muted);font-size:14px;line-height:1.7}
.empty .big{font-size:34px;display:block;margin-bottom:6px}

/* ── 모달 ────────────────────────────────── */
.modal{
  position:fixed;inset:0;z-index:100;background:rgba(6,26,30,.82);
  display:none;align-items:center;justify-content:center;padding:18px;
  backdrop-filter:blur(4px);
}
.modal.show{display:flex}
.sheet{
  width:100%;max-width:420px;background:var(--stage-2);border:1px solid var(--line);
  border-radius:18px;padding:20px;max-height:88vh;overflow:auto;
}
.sheet h3{margin:0 0 4px;font-size:21px}
.sheet p.sub{margin:0 0 16px;font-size:13px;color:var(--muted);line-height:1.55}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--butter);margin-bottom:5px}
.field input{width:100%}
.toolrow{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.toolrow .btn{flex:1;min-width:120px;height:44px;font-size:14px}
.warn{color:#FFA69E;font-size:12px;margin-top:8px;min-height:16px}
.note{font-size:12px;color:var(--muted);background:rgba(0,0,0,.2);padding:10px;border-radius:9px;line-height:1.6}

/* ── 토스트 ──────────────────────────────── */
#toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);
  background:var(--paper);color:var(--ink);padding:11px 18px;border-radius:999px;
  font-size:14px;font-weight:700;z-index:200;opacity:0;pointer-events:none;
  transition:.22s;max-width:90vw;text-align:center;
}
#toast.show{opacity:1;transform:translate(-50%,0)}

.setup{max-width:560px;margin:40px auto;padding:22px;background:rgba(0,0,0,.25);border-radius:16px;border:1px solid var(--line)}
.setup code{font-family:"JetBrains Mono",monospace;font-size:12px;background:rgba(0,0,0,.35);padding:2px 5px;border-radius:4px}
</style>
</head>
<body>

<!-- ══════════════════════════════════════════════════════
     ① 아래 firebaseConfig 를 본인 것으로 바꾸세요 (설명은 채팅 참고)
     ② CLASS_NAME, TEACHER_PW, MAX_PER_STUDENT 도 원하는 값으로
     ══════════════════════════════════════════════════════ -->
<script type="module">
const firebaseConfig = {
  apiKey: "여기에-붙여넣기",
  authDomain: "여기에-붙여넣기",
  projectId: "여기에-붙여넣기",
  storageBucket: "여기에-붙여넣기",
  messagingSenderId: "여기에-붙여넣기",
  appId: "여기에-붙여넣기"
};

const CLASS_NAME       = "6-1 점심방송";  // 헤더에 표시될 이름
const TEACHER_PW       = "4876";          // 교사 모드 비밀번호
const MAX_PER_STUDENT  = 1;               // 1인당 신청 가능 곡 수
const ROOM             = "room-6-1";      // 반이 여러 개면 반마다 다르게

/* ───────────────────────────────────────────────────── */

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, doc, addDoc, deleteDoc, updateDoc, setDoc,
  onSnapshot, query, orderBy, getDocs, writeBatch,
  arrayUnion, arrayRemove, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* 로컬 저장 (안 되면 메모리로 대체) */
const mem = {};
const store = {
  get(k){ try{ return localStorage.getItem(k) }catch{ return mem[k] ?? null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch{ mem[k]=v } }
};

if (firebaseConfig.apiKey.includes("붙여넣기")) {
  document.body.innerHTML = `<div class="setup">
    <h2 class="display" style="margin:0 0 8px">설정이 아직 남았습니다</h2>
    <p style="color:#7FA0A5;line-height:1.7;font-size:14px">
      이 파일을 열어 맨 위 <code>firebaseConfig</code> 부분을 Firebase 콘솔에서 복사한 값으로 바꾼 뒤 저장하세요.
      그 다음 다시 열면 신청곡 화면이 나타납니다.
    </p></div>`;
  throw new Error("config not set");
}

const app  = initializeApp(firebaseConfig);
const db   = getFirestore(app);
const songsCol = collection(db, ROOM, "data", "songs");
const stateDoc = doc(db, ROOM, "state");

/* ── 내 정보 ── */
let uid = store.get("sr_uid");
if(!uid){ uid = "u" + Math.random().toString(36).slice(2,10); store.set("sr_uid", uid); }
let myName = store.get("sr_name") || "";
let isTeacher = false;
let songs = [];
let roomState = { open:true, nowId:null };
let sortMode = store.get("sr_sort") || "new";

/* ── 토스트 ── */
let toastT;
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove("show"), 2000);
}

/* ── 이름 입력 ── */
function askName(){
  $("#nameModal").classList.add("show");
  $("#nameInput").value = myName;
  setTimeout(()=>$("#nameInput").focus(), 100);
}
$("#nameSave").addEventListener("click", ()=>{
  const v = $("#nameInput").value.trim().slice(0,12);
  if(v.length < 1){ $("#nameWarn").textContent = "이름을 적어 주세요."; return; }
  myName = v; store.set("sr_name", v);
  $("#nameModal").classList.remove("show");
  $("#me").textContent = v;
  render();
});
$("#nameInput").addEventListener("keydown", e=>{ if(e.key==="Enter") $("#nameSave").click(); });

/* ── 실시간 구독 ── */
onSnapshot(query(songsCol, orderBy("createdAt","asc")), snap=>{
  songs = snap.docs.map(d=>({ id:d.id, ...d.data() }));
  render();
}, err=>{ console.error(err); toast("연결에 문제가 있어요"); });

onSnapshot(stateDoc, snap=>{
  roomState = snap.exists() ? { open:true, nowId:null, ...snap.data() } : roomState;
  render();
});

/* ── 검색 ── */
let audio = null, playingUrl = null;
function preview(url, btn){
  if(playingUrl === url){ audio.pause(); playingUrl=null; renderResults(lastResults); return; }
  if(audio) audio.pause();
  audio = new Audio(url); audio.volume = .8; audio.play().catch(()=>toast("미리듣기를 불러오지 못했어요"));
  playingUrl = url;
  audio.onended = ()=>{ playingUrl=null; renderResults(lastResults); };
  renderResults(lastResults);
}

let lastResults = [];
async function search(){
  const q = $("#q").value.trim();
  if(!q){ return; }
  $("#searchBtn").disabled = true; $("#searchBtn").textContent = "…";
  try{
    const r = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&country=KR&media=music&entity=song&limit=12`);
    const j = await r.json();
    lastResults = j.results.map(x=>({
      trackId: String(x.trackId),
      title: x.trackName,
      artist: x.artistName,
      art: (x.artworkUrl100||"").replace("100x100bb","300x300bb"),
      preview: x.previewUrl || ""
    }));
    renderResults(lastResults);
    if(!lastResults.length) $("#results").innerHTML = `<div class="empty">검색 결과가 없어요. 가수 이름이나 노래 제목을 조금 다르게 적어 보세요.</div>`;
  }catch(e){
    $("#results").innerHTML = `<div class="empty">검색을 불러오지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.</div>`;
  }
  $("#searchBtn").disabled = false; $("#searchBtn").textContent = "검색";
}
$("#searchBtn").addEventListener("click", search);
$("#q").addEventListener("keydown", e=>{ if(e.key==="Enter") search(); });

function renderResults(list){
  $("#results").innerHTML = list.map((s,i)=>`
    <div class="res">
      <img src="${esc(s.art)}" alt="">
      <div class="meta"><div class="t">${esc(s.title)}</div><div class="a">${esc(s.artist)}</div></div>
      ${s.preview ? `<button class="mini" data-prev="${i}" aria-label="미리듣기">${playingUrl===s.preview?"◼":"▶"}</button>` : ""}
      <button class="mini add" data-add="${i}" aria-label="신청하기">+</button>
    </div>`).join("");
}

$("#results").addEventListener("click", e=>{
  const p = e.target.closest("[data-prev]");
  if(p){ preview(lastResults[+p.dataset.prev].preview); return; }
  const a = e.target.closest("[data-add]");
  if(a){ addSong(lastResults[+a.dataset.add]); }
});

/* ── 신청 ── */
async function addSong(s){
  if(!myName){ askName(); return; }
  if(!roomState.open && !isTeacher){ toast("지금은 신청을 받지 않아요"); return; }
  if(songs.some(x=>x.trackId===s.trackId)){ toast("이미 신청된 곡이에요. 하트를 눌러 주세요"); return; }
  const mine = songs.filter(x=>x.uid===uid).length;
  if(!isTeacher && mine >= MAX_PER_STUDENT){ toast(`한 사람당 ${MAX_PER_STUDENT}곡까지 신청할 수 있어요`); return; }
  const msg = ($("#msg").value||"").trim().slice(0,24);
  try{
    await addDoc(songsCol, {
      trackId:s.trackId, title:s.title, artist:s.artist, art:s.art, preview:s.preview,
      by:myName, uid, msg, likes:[], played:false, createdAt:serverTimestamp()
    });
    $("#q").value=""; $("#msg").value=""; $("#results").innerHTML=""; lastResults=[];
    if(audio){ audio.pause(); playingUrl=null; }
    toast("신청 완료");
  }catch(e){ console.error(e); toast("신청에 실패했어요. 다시 눌러 주세요"); }
}

/* ── 하트 ── */
async function toggleLike(id){
  if(!myName){ askName(); return; }
  const s = songs.find(x=>x.id===id); if(!s) return;
  const liked = (s.likes||[]).includes(uid);
  try{
    await updateDoc(doc(songsCol,id), { likes: liked ? arrayRemove(uid) : arrayUnion(uid) });
  }catch(e){ toast("잠시 후 다시 눌러 주세요"); }
}

/* ── 렌더 ── */
function render(){
  $("#me").textContent = myName || "이름 정하기";
  const lamp = $("#lamp");
  lamp.className = "lamp" + (roomState.open ? "" : " off");
  $("#lampTxt").textContent = roomState.open ? "ON AIR" : "CLOSED";

  // 지금 나오는 곡
  const now = songs.find(s=>s.id===roomState.nowId);
  $("#now").style.display = now ? "flex" : "none";
  if(now){
    $("#nowArt").src = now.art;
    $("#nowT").textContent = now.title;
    $("#nowA").textContent = `${now.artist} · ${now.by} 신청`;
  }

  // 큐시트
  let list = [...songs];
  if(sortMode==="hot") list.sort((a,b)=>(b.likes?.length||0)-(a.likes?.length||0));
  list.sort((a,b)=>(a.played?1:0)-(b.played?1:0));

  $("#cnt").textContent = `${songs.length}곡`;
  $$(".chip").forEach(c=>c.classList.toggle("on", c.dataset.sort===sortMode));

  if(!list.length){
    $("#cue").innerHTML = `<div class="empty"><span class="big">🎧</span>아직 신청된 곡이 없어요.<br>위에서 듣고 싶은 노래를 검색해 보세요.</div>`;
    return;
  }
  $("#cue").innerHTML = list.map((s,i)=>{
    const liked = (s.likes||[]).includes(uid);
    const n = (s.likes||[]).length;
    return `<div class="row ${s.id===roomState.nowId?"playing":""} ${s.played?"done":""}">
      <span class="no mono">${s.played?"–":String(i+1).padStart(2,"0")}</span>
      <img src="${esc(s.art)}" alt="">
      <div class="meta">
        <div class="t">${esc(s.title)}</div>
        <div class="a">${esc(s.artist)}</div>
        <div class="by">${esc(s.by)}${s.msg?` <span class="msg">· ${esc(s.msg)}</span>`:""}</div>
      </div>
      ${s.played?`<span class="stamp mono">완료</span>`:""}
      <button class="heart ${liked?"on":""}" data-like="${s.id}">♥ ${n}</button>
      ${isTeacher?`<button class="mini" data-menu="${s.id}" aria-label="관리">⋯</button>`:""}
    </div>`;
  }).join("");
}

$("#cue").addEventListener("click", e=>{
  const l = e.target.closest("[data-like]"); if(l){ toggleLike(l.dataset.like); return; }
  const m = e.target.closest("[data-menu]"); if(m){ openSongMenu(m.dataset.menu); }
});
$$(".chip").forEach(c=>c.addEventListener("click", ()=>{
  sortMode = c.dataset.sort; store.set("sr_sort", sortMode); render();
}));
$("#me").addEventListener("click", askName);

/* ── 교사 모드 ── */
$("#teacherBtn").addEventListener("click", ()=>{
  if(isTeacher){ openTeacher(); return; }
  $("#pwModal").classList.add("show"); $("#pw").value=""; $("#pwWarn").textContent="";
  setTimeout(()=>$("#pw").focus(),100);
});
$("#pwOk").addEventListener("click", ()=>{
  if($("#pw").value.trim() !== TEACHER_PW){ $("#pwWarn").textContent="비밀번호가 맞지 않습니다."; return; }
  isTeacher = true; $("#pwModal").classList.remove("show");
  $("#teacherBtn").textContent = "★"; render(); openTeacher();
});
$("#pw").addEventListener("keydown", e=>{ if(e.key==="Enter") $("#pwOk").click(); });

function openTeacher(){
  $("#tOpen").textContent = roomState.open ? "신청 마감하기" : "신청 다시 받기";
  $("#tModal").classList.add("show");
}
$("#tOpen").addEventListener("click", async ()=>{
  await setDoc(stateDoc, { open: !roomState.open }, { merge:true });
  $("#tModal").classList.remove("show");
  toast(roomState.open ? "신청을 마감했습니다" : "신청을 다시 받습니다");
});
$("#tClearNow").addEventListener("click", async ()=>{
  await setDoc(stateDoc, { nowId:null }, { merge:true });
  $("#tModal").classList.remove("show");
});
$("#tReset").addEventListener("click", async ()=>{
  if(!confirm("신청곡을 모두 지웁니다. 되돌릴 수 없습니다. 진행할까요?")) return;
  const snap = await getDocs(songsCol);
  const b = writeBatch(db); snap.docs.forEach(d=>b.delete(d.ref)); await b.commit();
  await setDoc(stateDoc, { nowId:null }, { merge:true });
  $("#tModal").classList.remove("show"); toast("전체를 지웠습니다");
});

let menuId = null;
function openSongMenu(id){ menuId = id; const s = songs.find(x=>x.id===id);
  $("#mTitle").textContent = s ? s.title : "";
  $("#mDone").textContent = s?.played ? "완료 취소" : "재생 완료로 표시";
  $("#mModal").classList.add("show");
}
$("#mPlay").addEventListener("click", async ()=>{
  await setDoc(stateDoc, { nowId: menuId }, { merge:true });
  $("#mModal").classList.remove("show");
});
$("#mDone").addEventListener("click", async ()=>{
  const s = songs.find(x=>x.id===menuId);
  await updateDoc(doc(songsCol,menuId), { played: !s.played });
  $("#mModal").classList.remove("show");
});
$("#mDel").addEventListener("click", async ()=>{
  await deleteDoc(doc(songsCol,menuId));
  $("#mModal").classList.remove("show"); toast("지웠습니다");
});

/* 모달 바깥 클릭으로 닫기 */
$$(".modal").forEach(m=>m.addEventListener("click", e=>{
  if(e.target===m && m.id!=="nameModal") m.classList.remove("show");
}));
$$("[data-close]").forEach(b=>b.addEventListener("click", ()=>b.closest(".modal").classList.remove("show")));

$("#className").textContent = CLASS_NAME;
if(!myName) askName();
render();
</script>

<header>
  <div class="wrap bar">
    <span class="lamp" id="lamp"><b></b><span id="lampTxt">ON AIR</span></span>
    <span class="title display" id="className"></span>
    <span class="spacer"></span>
    <button class="me" id="me" style="background:none;border:none;cursor:pointer">이름 정하기</button>
    <button class="icon-btn" id="teacherBtn" aria-label="교사 모드">☰</button>
  </div>
</header>

<div class="wrap">

  <div class="now" id="now" style="display:none">
    <img class="disc" id="nowArt" alt="">
    <div>
      <div class="lbl">NOW PLAYING</div>
      <div class="t display" id="nowT"></div>
      <div class="a" id="nowA"></div>
    </div>
  </div>

  <div class="panel">
    <h2>노래 신청하기</h2>
    <div class="searchrow">
      <input type="text" id="q" placeholder="가수 또는 노래 제목" autocomplete="off">
      <button class="btn" id="searchBtn">검색</button>
    </div>
    <input type="text" id="msg" placeholder="한마디 (선택 · 24자까지)" maxlength="24" style="margin-top:8px;height:44px">
    <div class="results" id="results"></div>
  </div>

  <div class="cuehead">
    <h2 class="display">큐시트</h2>
    <span class="cnt mono" id="cnt">0곡</span>
    <div class="sorts">
      <button class="chip on" data-sort="new">신청순</button>
      <button class="chip" data-sort="hot">인기순</button>
    </div>
  </div>
  <div class="cue" id="cue"></div>
</div>

<!-- 이름 -->
<div class="modal" id="nameModal">
  <div class="sheet">
    <h3 class="display">누구인지 알려 주세요</h3>
    <p class="sub">친구들에게 보이는 이름입니다. 실명 대신 번호나 별명을 적어 주세요.</p>
    <div class="field">
      <label>번호 또는 별명</label>
      <input type="text" id="nameInput" maxlength="12" placeholder="예: 12번, 초코우유">
    </div>
    <div class="warn" id="nameWarn"></div>
    <button class="btn" id="nameSave" style="width:100%">시작하기</button>
  </div>
</div>

<!-- 교사 비밀번호 -->
<div class="modal" id="pwModal">
  <div class="sheet">
    <h3 class="display">교사 모드</h3>
    <p class="sub">신청 마감, 재생 표시, 삭제를 할 수 있습니다.</p>
    <div class="field"><label>비밀번호</label><input type="password" id="pw" inputmode="numeric"></div>
    <div class="warn" id="pwWarn"></div>
    <div class="toolrow">
      <button class="btn ghost" data-close>닫기</button>
      <button class="btn" id="pwOk">들어가기</button>
    </div>
  </div>
</div>

<!-- 교사 도구 -->
<div class="modal" id="tModal">
  <div class="sheet">
    <h3 class="display">방송 관리</h3>
    <p class="sub">곡을 하나씩 다루려면 큐시트에서 ⋯ 를 누르세요.</p>
    <div class="toolrow">
      <button class="btn" id="tOpen">신청 마감하기</button>
      <button class="btn ghost" id="tClearNow">지금 곡 표시 지우기</button>
      <button class="btn pink" id="tReset">전체 지우기</button>
      <button class="btn ghost" data-close>닫기</button>
    </div>
  </div>
</div>

<!-- 곡 관리 -->
<div class="modal" id="mModal">
  <div class="sheet">
    <h3 class="display" id="mTitle"></h3>
    <p class="sub">이 곡을 어떻게 할까요?</p>
    <div class="toolrow">
      <button class="btn" id="mPlay">지금 이 곡 재생 중</button>
      <button class="btn ghost" id="mDone">재생 완료로 표시</button>
      <button class="btn pink" id="mDel">삭제</button>
      <button class="btn ghost" data-close>닫기</button>
    </div>
  </div>
</div>

<div id="toast"></div>
</body>
</html>
