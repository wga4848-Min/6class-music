<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#173F6B">
<title>지구촌 문제 해결 조사단</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d2433; --muted:#5b6475; --line:#e2e5eb; --bg:#f4f5f8; --card:#fff;
  --navy:#173F6B; --ok:#1f8a4c; --ok-bg:#e6f5ec; --no:#c2410c; --no-bg:#fff1e6;
  --tc:#173F6B; --tt:#DDE8F6; --ton:#fff;      /* 모둠 문제 색 */
  --ac:#364FC7; --at:#E3E8FB;                  /* 주체 색 */
  --r:18px; color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:19px;line-height:1.6;word-break:keep-all;overflow-wrap:break-word}
@media (min-width:760px){body{font-size:20px}}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:900px;margin:0 auto;padding:0 16px 40px}
.wide{max-width:1500px}
.display{font-family:"Jua",sans-serif;font-weight:400;letter-spacing:-.01em}
.hidden{display:none!important}
.btn{border:0;border-radius:14px;padding:10px 18px;min-height:54px;font-weight:800;background:var(--line);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--navy);color:#fff}
.btn.ghost{background:#fff;border:2px solid var(--line)}
.btn.small{min-height:44px;font-size:16px;padding:6px 14px}
.btn:disabled{opacity:.4;cursor:default}
.cta{display:flex;width:100%;min-height:68px;font-size:24px;font-family:"Jua",sans-serif;font-weight:400;border-radius:18px}
.card{background:var(--card);border-radius:var(--r);box-shadow:0 1px 8px rgba(20,30,60,.08);padding:16px 18px;margin:0 0 14px}
.muted{color:var(--muted)}
.err{background:var(--no-bg);color:#7c2d12;border-radius:14px;padding:12px 16px;margin:12px 0;font-weight:600}
.err pre{background:#fff;border-radius:8px;padding:8px;font-size:14px;white-space:pre-wrap}
.demo-badge{display:inline-block;font-size:14px;background:#FFE58A;color:#5a4300;border-radius:999px;padding:2px 10px;margin-left:8px;vertical-align:middle;font-family:"Pretendard Variable",sans-serif;font-weight:800}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#1A2233;color:#fff;padding:12px 20px;border-radius:12px;font-size:17px;opacity:0;transition:.25s;z-index:40;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* header */
.top{display:flex;align-items:center;gap:14px;padding:22px 0 12px}
.top svg{flex:none;width:54px;height:54px}
.top h1{margin:0;font-size:clamp(28px,4.5vw,40px);line-height:1.15;color:var(--navy)}
.top .sub{color:var(--muted);font-size:16px;font-weight:600}
.sec-t{font-family:"Jua",sans-serif;font-size:24px;margin:4px 0 10px;color:var(--navy)}
.sec-t small{font-family:"Pretendard Variable",sans-serif;font-size:15px;color:var(--muted);font-weight:600;margin-left:6px}

/* start */
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.num{height:64px;border-radius:14px;border:2px solid var(--line);background:#fff;font-family:"Jua",sans-serif;font-size:28px}
.num.sel{border-color:var(--navy);background:var(--navy);color:#fff}
.groups{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:760px){.groups{grid-template-columns:repeat(4,1fr)}}
.grp{border:3px solid var(--line);background:#fff;border-radius:16px;padding:10px 8px;min-height:86px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25}
.grp b{font-family:"Jua",sans-serif;font-weight:400;font-size:26px}
.grp span{font-size:15px;font-weight:800;border-radius:999px;padding:2px 10px;margin-top:4px}
.grp.sel{border-color:var(--navy);box-shadow:0 0 0 3px var(--navy) inset}
.actors{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:640px){.actors{grid-template-columns:1fr 1fr}}
.act{border:3px solid var(--line);background:#fff;border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:12px;text-align:left;min-height:84px}
.act .ic{flex:none;width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff}
.act .ic svg{width:32px;height:32px}
.act b{display:block;font-size:22px;line-height:1.2}
.act small{display:block;font-size:14px;color:var(--muted);font-weight:600;line-height:1.35}
.act .taken{font-size:13px;font-weight:800;color:var(--no);margin-top:2px}
.act.sel{box-shadow:0 0 0 3px var(--ac) inset;border-color:var(--ac)}

/* student steps */
.who{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:14px 0 6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:800;border-radius:999px;padding:4px 12px;white-space:nowrap}
.stepbar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 14px}
.stepbar div{border:2px solid var(--line);background:#fff;border-radius:12px;text-align:center;font-weight:800;font-size:15px;padding:6px 4px;color:var(--muted);line-height:1.25}
.stepbar div.on{border-color:var(--ac);background:var(--ac);color:#fff}
.stepbar div.done{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.case{border-radius:var(--r);overflow:hidden;background:#fff;box-shadow:0 1px 8px rgba(20,30,60,.08);margin:0 0 14px}
.case-h{background:var(--ac);color:#fff;padding:10px 16px;font-weight:800;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.case-h .tp{font-size:14px;border-radius:999px;padding:2px 10px;background:#fff;color:var(--ac)}
.case-b{padding:14px 16px 16px}
.case-t{margin:0 0 4px;font-size:1.3em;line-height:1.35;letter-spacing:-.02em}
.place{font-size:15px;font-weight:800;color:var(--ac);margin-bottom:8px}
.case-b p{margin:0 0 8px;font-size:1.04em}
.src{font-size:13px;color:var(--muted);margin-top:4px}
.others{display:grid;gap:8px;margin:0 0 14px}
.oth{background:#fff;border:2px solid var(--line);border-radius:14px;overflow:hidden}
.oth > button{width:100%;border:0;background:transparent;text-align:left;padding:10px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:800;min-height:52px}
.oth > button i{font-style:normal;font-size:13px;font-weight:800;border-radius:999px;padding:2px 9px;white-space:nowrap}
.oth .in{padding:0 14px 12px;font-size:.92em}
.oth .in p{margin:0 0 6px}
.q{background:#fff;border-radius:var(--r);padding:16px 18px;margin:0 0 14px;box-shadow:0 1px 8px rgba(20,30,60,.08);border-top:6px solid var(--ac)}
.q h3{margin:0 0 4px;font-size:1.1em;line-height:1.45}
.q h3 em{font-style:normal;color:var(--ac)}
.q .guide{font-size:15px;color:var(--muted);font-weight:600;margin:0 0 10px}
textarea{width:100%;min-height:110px;border:2px solid var(--line);border-radius:14px;padding:12px 14px;resize:vertical;background:#fbfbfc;line-height:1.5}
textarea:focus,input[type=text]:focus{outline:none;border-color:var(--ac);background:#fff}
input[type=text]{width:100%;min-height:52px;border:2px solid var(--line);border-radius:14px;padding:8px 14px;background:#fbfbfc}
.count{font-size:14px;color:var(--muted);text-align:right;margin-top:4px;font-weight:600}
.frame{background:#fffbea;border:1px dashed #e8c95a;border-radius:12px;padding:8px 12px;font-size:15px;color:#3b3200;font-weight:600;margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pick{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;min-height:46px;font-weight:700;font-size:16px}
.pick.sel{border-color:var(--ac);background:var(--ac);color:#fff}
.hintbtn{border:0;background:transparent;color:var(--ac);font-weight:800;text-decoration:underline;padding:6px 0;min-height:40px;font-size:16px}
.hint{background:var(--at);border-radius:12px;padding:10px 14px;font-size:15px;font-weight:600;margin-top:8px}
.hint div{margin:2px 0}
.partners{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.partner{border:2px solid var(--line);background:#fff;border-radius:14px;min-height:60px;font-weight:800;font-size:16px;line-height:1.2;padding:6px}
.partner.sel{color:#fff}
.nav{display:flex;gap:10px;margin-top:6px}
.nav .btn{flex:1}
.nav .btn.back{flex:0 0 120px}
.done-hero{text-align:center;padding:24px 16px}
.done-hero .big{font-size:64px;line-height:1}
.done-hero h2{margin:8px 0 4px;font-family:"Jua",sans-serif;font-weight:400;font-size:34px;color:var(--navy)}
.sum dt{font-size:14px;font-weight:800;color:var(--ac);margin-top:10px}
.sum dd{margin:0;font-weight:600}

.exbox{display:grid;gap:6px}
.exr{display:grid;grid-template-columns:118px 1fr;gap:10px;align-items:baseline;border-bottom:1px dashed var(--line);padding-bottom:6px}
.exr:last-child{border-bottom:0}
.exk{font-size:14px;font-weight:800;color:var(--ac);background:var(--at);border-radius:8px;padding:2px 8px;text-align:center}
.kws{display:grid;gap:8px}
.kw{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#f6f7fa;border-radius:12px;padding:6px 10px}
.kw b{flex:1;min-width:160px}
.tips{margin:10px 0 0;padding-left:20px;font-size:15px;color:var(--muted);font-weight:600}
.fl{display:block;margin:0 0 12px}
.fl > span{display:block;font-weight:800;margin-bottom:4px}
.req,.opt{font-style:normal;font-size:12px;border-radius:999px;padding:1px 8px;margin-left:4px;vertical-align:middle}
.req{background:var(--ac);color:#fff}
.opt{background:#eef0f4;color:var(--muted)}
.srcl{font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}
.srcl a{color:var(--c)}
.matrix td .cs2{font-size:13px;color:var(--muted);margin-top:4px}
@media (max-width:520px){.exr{grid-template-columns:1fr;gap:2px}}
/* group board */
.gh{border-radius:var(--r);padding:16px 18px;margin:14px 0;background:var(--tc);color:var(--ton)}
.gh h1{margin:0;font-family:"Jua",sans-serif;font-weight:400;font-size:clamp(28px,4vw,42px);line-height:1.2}
.gh p{margin:2px 0 0;font-weight:700;opacity:.95}
.board{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:700px){.board{grid-template-columns:1fr 1fr}}
@media (min-width:1150px){.board{grid-template-columns:repeat(4,1fr)}}
.col{background:#fff;border-radius:var(--r);box-shadow:0 1px 8px rgba(20,30,60,.08);overflow:hidden;display:flex;flex-direction:column;border-top:8px solid var(--c)}
.col-h{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--t)}
.col-h .ic{width:40px;height:40px;border-radius:12px;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.col-h .ic svg{width:26px;height:26px}
.col-h b{font-size:20px;line-height:1.2;display:block}
.col-h small{font-size:14px;font-weight:700;color:var(--muted)}
.col-b{padding:12px 14px;flex:1;display:flex;flex-direction:column;gap:8px}
.lab{font-size:13px;font-weight:800;color:var(--c)}
.idea{font-size:1.08em;font-weight:800;line-height:1.45}
.eff{font-size:.9em;font-weight:600;color:#333}
.mini-chips{display:flex;flex-wrap:wrap;gap:4px}
.mini-chips span{font-size:13px;font-weight:800;border-radius:999px;padding:2px 9px;background:var(--t);color:var(--c)}
.mini-chips span.lim{background:#f1f3f7;color:#555}
.with{font-size:15px;font-weight:700;background:#f6f7fa;border-radius:10px;padding:6px 10px}
.empty{color:var(--muted);font-weight:700;text-align:center;padding:24px 8px}
.star{margin-top:auto;border:2px solid var(--line);background:#fff;border-radius:12px;min-height:48px;font-weight:800;font-size:16px}
.star.on{background:#FFE58A;border-color:#E8B90E;color:#5a4300}
.talk{display:grid;gap:12px;margin-top:14px}
@media (min-width:900px){.talk{grid-template-columns:.9fr 1.1fr}}
.order{list-style:none;margin:0;padding:0;counter-reset:o}
.order li{counter-increment:o;display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);font-weight:700}
.order li:last-child{border-bottom:0}
.order li::before{content:counter(o);flex:none;width:30px;height:30px;border-radius:50%;background:var(--tc);color:var(--ton);display:flex;align-items:center;justify-content:center;font-size:15px;margin-top:2px}
.order li small{display:block;color:var(--muted);font-weight:600;font-size:.82em}
.saved{font-size:14px;color:var(--muted);font-weight:700;margin-top:6px}

/* teacher */
.tbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:18px 0 8px}
.tbar h1{margin:0;font-family:"Jua",sans-serif;font-weight:400;font-size:clamp(26px,3.4vw,38px);color:var(--navy)}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:#fff;border-radius:14px;padding:8px 14px;box-shadow:0 1px 6px rgba(20,30,60,.06);font-weight:800}
.stat b{font-size:26px;color:var(--navy);margin-left:4px}
.flow{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.flow span{background:#fff;border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:800;font-size:15px}
.flow span i{font-style:normal;color:var(--muted);margin-left:4px}
.matrix{width:100%;border-collapse:separate;border-spacing:6px;table-layout:fixed}
.matrix th{font-weight:800;font-size:16px;padding:8px;border-radius:12px}
.matrix th.rowh{width:130px;text-align:left}
.matrix td{background:#fff;border-radius:12px;vertical-align:top;padding:8px 10px;font-size:15px;line-height:1.45;box-shadow:0 1px 4px rgba(20,30,60,.06)}
.matrix td .no{font-size:13px;font-weight:800;color:var(--muted)}
.matrix td .ti{font-weight:800}
.matrix td .st{font-size:13px;font-weight:800;color:#8a6d00}
.matrix td.wait{color:#aab;text-align:center;vertical-align:middle;font-weight:700}
body.tv .matrix td{font-size:19px}
body.tv .matrix th{font-size:20px}
.agg{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:900px){.agg{grid-template-columns:repeat(4,1fr)}}
.agg .box{background:#fff;border-radius:16px;padding:12px 14px;border-top:6px solid var(--c);box-shadow:0 1px 6px rgba(20,30,60,.06)}
.agg h3{margin:0 0 6px;font-size:18px}
.bar{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;margin:4px 0;font-size:15px;font-weight:700}
.bar .tr{grid-column:1/-1;height:8px;background:#eef0f4;border-radius:99px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--c);border-radius:99px}
.sentences .s{background:#fff;border-radius:14px;padding:10px 14px;margin:0 0 8px;border-left:8px solid var(--c);font-weight:700}
.sentences .s small{display:block;color:var(--muted);font-size:13px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.modal{position:fixed;inset:0;background:rgba(10,14,22,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
.modal .box2{background:#fff;border-radius:18px;padding:20px;width:min(360px,100%)}
.modal input{width:100%;min-height:54px;border:2px solid var(--navy);border-radius:12px;padding:8px 12px;font-size:22px;margin:10px 0}

/* print (#print) */
.pp{display:none}
body.pmode{background:#e6e8ee}
body.pmode .pp{display:block}
body.pmode #app{display:none}
.pbar{position:sticky;top:0;z-index:5;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;padding:10px;background:rgba(29,36,51,.92);color:#fff;font-size:16px}
.pbar a{color:#cfd6e6}
.pg{width:210mm;height:297mm;margin:12px auto;background:#fff;padding:9mm 10mm;box-shadow:0 2px 14px rgba(20,30,60,.12);font-size:10pt;line-height:1.45;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact;display:flex;flex-direction:column}
.pg .band{background:var(--c);color:#fff;border-radius:3mm;padding:2.5mm 5mm;display:flex;justify-content:space-between;align-items:center}
.pg .band b{font-size:19pt;font-family:"Jua",sans-serif;font-weight:400}
.pg .band span{font-size:9.5pt;font-weight:700}
.pg .info{display:flex;gap:6mm;margin:2.5mm 0;font-weight:700;font-size:10.5pt}
.pg .info span{border-bottom:1px solid #999;min-width:22mm;display:inline-block}
.pg .cg{display:grid;grid-template-columns:1fr 1fr;gap:2.5mm;margin-bottom:3mm}
.pg .cs{border:1.4px solid var(--t);border-radius:2.5mm;overflow:hidden}
.pg .cs .h{font-weight:800;font-size:8.6pt;padding:.8mm 2.5mm;display:flex;justify-content:space-between}
.pg .cs .b{padding:1.6mm 2.5mm}
.pg .cs .tt{font-weight:800;font-size:10pt;margin-bottom:.8mm;line-height:1.3}
.pg .cs p{margin:0 0 .6mm;font-size:8.8pt;line-height:1.4}
.pg .cs .sr{font-size:7pt;color:#666}
.pg .qq{border:1px solid #d5d9e1;border-radius:2.5mm;padding:2mm 3mm;margin-bottom:2.2mm}
.pg .qq .x{font-weight:800;font-size:10.5pt;margin-bottom:1mm}
.pg .ln{height:var(--h);background:repeating-linear-gradient(transparent 0 7.2mm,#b9bec9 7.2mm 7.5mm)}
.pg .ck{display:flex;flex-wrap:wrap;gap:1mm 5mm;font-size:9.5pt;font-weight:600}
.pg .gcols{display:grid;grid-template-columns:repeat(4,1fr);gap:2.5mm;flex:1;margin:3mm 0}
.pg .gc{border:1.6px solid var(--c);border-radius:3mm;display:flex;flex-direction:column;overflow:hidden}
.pg .gc .h{background:var(--c);color:#fff;font-weight:800;padding:1.5mm 2.5mm;font-size:11pt}
.pg .gc .b{padding:2mm 2.5mm;flex:1;display:flex;flex-direction:column;gap:1.5mm;font-size:9pt;font-weight:700}
.pg .exp,.pg .srch{border:1.4px solid var(--c);border-radius:2.5mm;padding:2mm 3mm;margin-bottom:2.2mm}
.pg .eh{font-weight:800;font-size:10.5pt;margin-bottom:1mm;color:var(--c)}
.pg .eh i{font-style:normal;font-size:8.5pt;border-radius:9px;padding:0 2mm;margin-left:2mm}
.pg .eh small{font-size:8.5pt;color:#555;margin-left:2mm}
.pg .er{display:grid;grid-template-columns:26mm 1fr;gap:2mm;font-size:9pt;padding:.5mm 0;border-bottom:1px dashed #ddd}
.pg .er:last-child{border-bottom:0}
.pg .k{font-weight:800;font-size:8.8pt;color:var(--c)}
.pg .srch table{width:100%;border-collapse:collapse;font-size:9pt}
.pg .srch th{width:30mm;text-align:left;padding:.6mm 2mm;font-weight:800;border-radius:1.5mm}
.pg .srch td{padding:.6mm 2mm;font-weight:600}
.pg .tp2{font-size:8pt;color:#555;margin-top:1mm}
.pg .fr{display:grid;grid-template-columns:28mm 1fr;gap:2mm;align-items:end}
@media print{
  @page{size:A4;margin:0}
  body.pmode{background:#fff}
  .pbar{display:none!important}
  .pg{margin:0;box-shadow:none;break-after:page}
  .pg:last-child{break-after:auto}
  #toast{display:none!important}
}
</style>
</head>

<div id="app"></div>
<div class="pp" id="pp"></div>

async function firebaseApi(){
  const appMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const fs = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
  const app = appMod.initializeApp(firebaseConfig);
  const db = fs.getFirestore(app);
  const col = fs.collection(db, ROOM, ACT_ID, "responses");
  const gcol = fs.collection(db, ROOM, ACT_ID, "groups");
  const race = w => Promise.race([w, new Promise((_, rej) => setTimeout(() => rej(Object.assign(new Error("timeout"), { code: "timeout" })), 12000))]);
  const ms = x => x?.toMillis ? x.toMillis() : (x || 0);
  return {
    save(no, rec){ return race(fs.setDoc(fs.doc(col, String(no)), { ...rec, at: fs.serverTimestamp() }, { merge: true })); },
    subscribe(cb, onErr){ return fs.onSnapshot(col, snap => cb(snap.docs.map(d => ({ ...d.data(), at: ms(d.data().at) }))), onErr); },
    saveGroup(g, rec){ return race(fs.setDoc(fs.doc(gcol, String(g)), { ...rec, at: fs.serverTimestamp() }, { merge: true })); },
    subscribeGroups(cb, onErr){ return fs.onSnapshot(gcol, snap => { const o = {}; snap.forEach(d => { o[d.id] = { ...d.data(), at: ms(d.data().at) }; }); cb(o); }, onErr); },
    async clear(){
      for (const c of [col, gcol]) { const snap = await fs.getDocs(c); const b = fs.writeBatch(db); snap.forEach(d => b.delete(d.ref)); await b.commit(); }
    },
  };
}

    <div class="case-h"><span>${esc(a.name)}의 노력${main ? "" : ""}</span><span class="tp" style="background:${t.c};color:${t.on}">${esc(t.name)}</span></div>
    <div class="case-b"><h2 class="case-t">${esc(c.title)}</h2><div class="place">${esc(c.place)}</div>
      ${c.body.map(p => `<p>${esc(p)}</p>`).join("")}<div class="src">출처: ${esc(c.src)} (초등학생 눈높이로 요약)</div></div></article>`;
}

/* ── 1. 사례 찾기: 예시 1개 + 직접 검색 ── */
function exampleFor(a, tp){ const e = EXAMPLES[a - 1]; return e.main.topic === tp ? e.alt : e.main; }
function exampleCard(ex, a){
  const t = TOPICS[ex.topic - 1];
  const row = (k, v) => `<div class="exr"><span class="exk">${k}</span><span>${esc(v)}</span></div>`;
  return `<article class="case" style="--ac:${a.c}">
    <div class="case-h"><span>예시 · ${esc(a.name)}의 노력</span><span class="tp" style="background:${t.c};color:${t.on}">${esc(t.name)}</span></div>
    <div class="case-b exbox">${row("사례 제목", ex.title)}${row("누가", ex.who)}${row("무엇을 했나요", ex.what)}${row("결과·숫자", ex.res)}${row("출처", ex.src)}</div></article>`;
}
function renderStep1(){
  setTheme();

    <section class="q search">
      <p class="guide" style="margin-bottom:8px">추천 검색어를 누르면 새 창에서 검색돼요. 다른 검색어로 찾아도 좋아요. <b>예시와 다른 사례</b>를 찾아요.</p>

      ${field("cwhat", "무엇을 했나요", "어떤 노력을 했는지 내 말로 1~2문장으로 써요", true, true)}
      ${field("cres", "결과·숫자", "그 노력으로 무엇이 달라졌는지, 기억에 남는 숫자", false)}
      ${field("csrc", "출처", "누리집이나 신문 이름, 날짜 (예: ○○신문, 2025. 3. 5.)", true)}
      ${field("curl", "주소", "찾은 페이지 주소를 붙여 넣어요", false)}
      <div class="count" id="cnt1"></div>

    const short = S.cwhat.trim() && S.cwhat.trim().length < 10;

  nx.onclick = () => { S.step = 2; keep(); render(); scrollTo(0, 0); };
  $("#chg").onclick = () => { S.step = 0; keep(); render(); };

/* ── 2. 가진 힘과 한계 ── */

      <p class="guide">다른 주체보다 ${esc(a.name)}${josa(a.name, "이", "가")} 특히 잘할 수 있는 것을 2개까지 골라요.</p>
      <div class="chips">${chips(POWERS, "powers", 2)}</div>
      <button class="hintbtn" id="hint">${S.hint ? "힌트 숨기기" : "다른 사례의 힘 보기 (힌트)"}</button>
      ${S.hint ? `<div class="hint">${hints}</div>` : ""}</section>
    <section class="q"><h3>Q3. <em>${esc(a.name)}</em>의 노력에는 어떤 한계가 있을까요?</h3>

    <div class="nav"><button class="btn ghost back" id="prev">← 이전</button><button class="btn primary" id="next">다음: 나의 해결 방법 →</button></div></div>`;

  $("#app").querySelectorAll("[data-p]").forEach(b => b.onclick = () => { S.partner = +b.dataset.p; keep(); renderStep3(); });
  $("#ex").onclick = () => { S.ex = !S.ex; keep(); renderStep3(); };
  $("#prev").onclick = () => { S.step = 2; keep(); render(); };
  $("#chg").onclick = () => { S.step = 0; keep(); render(); };
  sd.onclick = async () => {
    sd.disabled = true; sd.textContent = "보내는 중…";
    const rec = { no: S.no, g: S.g, a: S.a, topic: GROUP_TOPIC[S.g] || S.g, state: "제출", ctitle: S.ctitle.trim(), cwho: S.cwho.trim(), cwhat: S.cwhat.trim(), cres: S.cres.trim(), csrc: S.csrc.trim(), curl: S.curl.trim(), powers: S.powers, limits: S.limits, idea: S.idea.trim(), partner: S.partner, why: S.why.trim() };

      toast(errKind(e) === "perm" ? "저장 권한이 없어요. 선생님께 알려 주세요." : "인터넷 연결을 확인하고 다시 눌러 주세요.", 3500); }

}

let groupG = 1, sentDraft = null;
function renderGroup(g){

    <div class="gh"><h1>${g}모둠 · ${esc(t.name)} 해결 협력 사슬</h1><p>네 주체의 방법을 이어, 가장 효과적인 방법을 함께 골라요</p></div>
    <div class="board" id="board"></div>

      <div class="card"><div class="sec-t">모둠 토의 순서</div><ol class="order">
        <li><div>한 사람씩 내 방법 소개하기 (30초)<small>“나는 ○○로서 ~을 하겠어. 왜냐하면 ~”</small></div></li>
        <li><div>서로 질문하기<small>“그 방법의 한계는 뭘까?” “누가 도와주면 될까?”</small></div></li>
        <li><div>가장 효과적인 방법에 ★ 누르기<small>기준: 여러 사람에게 도움이 되는가? 오래 계속할 수 있는가?</small></div></li>
        <li><div>우리 모둠 한 문장 쓰기<small>네 주체가 왜 함께해야 하는지 까닭을 넣어요</small></div></li></ol></div>
      <div class="card"><div class="sec-t">우리 모둠 한 문장</div>
        <div class="frame">${esc(frame)}</div>
        <textarea id="sent" maxlength="400" placeholder="모둠에서 의논한 한 문장을 써요">${esc(sentDraft ?? gd.sentence ?? "")}</textarea>
        <div style="display:flex;gap:8px;align-items:center;margin-top:8px"><button class="btn primary" id="saveSent">저장하기</button><span class="saved" id="savedAt">${gd.sentence ? `저장됨${gd.by ? ` · ${gd.by}번` : ""}` : "아직 저장 전"}</span></div></div>
    </div>
    <p style="text-align:center;margin-top:16px">${[1, 2, 3, 4].filter(x => x !== g).map(x => `<a href="#group=${x}" class="muted" style="font-size:15px;margin:0 6px">${x}모둠 화면</a>`).join("")} · <a href="#" class="muted" style="font-size:15px">처음 화면</a></p></div>`;
  drawBoard();
  const ta = $("#sent"); ta.oninput = () => { sentDraft = ta.value; };
  $("#saveSent").onclick = async () => {
    const v = ta.value.trim(); if (!v) return toast("한 문장을 먼저 써요");
    try { await api.saveGroup(g, { sentence: v, by: S.no || null, topic: tp }); sentDraft = null; toast("모둠 한 문장을 저장했어요"); }
    catch (e) { toast("저장하지 못했어요. 인터넷을 확인해 주세요.", 3000); }
  };
}
function drawBoard(){
  const g = groupG, el = $("#board"); if (!el) return;
  const members = RES.filter(r => r.g === g);
  const stars = {}; members.forEach(r => { if (r.star) stars[r.star] = (stars[r.star] || 0) + 1; });
  const me = S.no && S.g === g ? RES.find(r => r.no === S.no) : null;
  el.innerHTML = ACTORS.map(a => {
    const r = members.find(m => m.a === a.n);
    let body;
    if (!r || r.state !== "제출") body = `<div class="empty">${r ? `${r.no}번 친구가 조사 중이에요…` : "아직 맡은 친구가 없어요"}</div>`;
    else {
      const p = r.partner ? A(r.partner) : null;
      body = `<div><div class="lab">나의 해결 방법</div><div class="idea">${esc(r.idea)}</div></div>
        <div><div class="lab">찾은 사례</div><div class="eff"><b>${esc(r.ctitle || "")}</b>${r.cwho ? ` · ${esc(r.cwho)}` : ""}<br>${esc(r.cwhat || "")}</div><div class="srcl">출처: ${r.curl && /^https?:\/\//.test(r.curl) ? `<a href="${esc(r.curl)}" target="_blank" rel="noopener">${esc(r.csrc || "링크")}</a>` : esc(r.csrc || "")}</div></div>
        <div class="mini-chips">${(r.powers || []).map(i => `<span>${esc(POWERS[i])}</span>`).join("")}${(r.limits || []).map(i => `<span class="lim">한계: ${esc(LIMITS[i])}</span>`).join("")}</div>
        ${p ? `<div class="with">→ <b style="color:${p.c}">${esc(p.name)}</b>${josa(p.name, "과", "와")} 함께${r.why ? `: ${esc(r.why)}` : ""}</div>` : ""}`;
    }
    const n = stars[a.n] || 0, mine = me && me.star === a.n;
    return `<section class="col" style="--c:${a.c};--t:${a.t}">
      <div class="col-h"><span class="ic">${ICONS[a.icon]}</span><div><b>${esc(a.name)}</b><small>${r ? `${r.no}번` : ""}</small></div></div>
      <div class="col-b">${body}
        ${r && r.state === "제출" ? `<button class="star ${mine ? "on" : ""}" data-star="${a.n}" ${me ? "" : "disabled"} title="${me ? "" : "내 태블릿에서 눌러요"}">★ 가장 효과적 ${n ? `· ${n}표` : ""}</button>` : ""}</div></section>`;
  }).join("");
  el.querySelectorAll("[data-star]").forEach(b => b.onclick = async () => {
    const a = +b.dataset.star, cur = me?.star === a ? null : a;
    try { await api.save(S.no, { star: cur }); } catch (e) { toast("저장하지 못했어요", 2500); }
  });
}

  const done = RES.filter(r => r.state === "제출"), doing = RES.filter(r => r.state !== "제출");
  const head = [1, 2, 3, 4].map(g => { const t = T(g); return `<th style="background:${t.c};color:${t.on}">${g}모둠 · ${esc(t.name)}</th>`; }).join("");
  const stars = {}; RES.forEach(r => { if (r.star) stars[r.g + "-" + r.star] = (stars[r.g + "-" + r.star] || 0) + 1; });
  const rows = ACTORS.map(a => `<tr><th class="rowh" style="background:${a.t};color:${a.c}">${esc(a.name)}</th>${[1, 2, 3, 4].map(g => {
    const r = RES.find(x => x.g === g && x.a === a.n);
    if (!r) return `<td class="wait">—</td>`;
    if (r.state !== "제출") return `<td class="wait">${r.no}번 조사 중…</td>`;
    const s = stars[g + "-" + a.n];
    return `<td><div class="no">${r.no}번${s ? ` <span class="st">★ ${s}</span>` : ""}</div><div class="ti">${esc(r.idea)}</div><div class="cs2">사례: ${esc(r.ctitle || "")}${r.csrc ? ` <span>(${esc(r.csrc)})</span>` : ""}</div></td>`; }).join("")}</tr>`).join("");
  const agg = ACTORS.map(a => {
    const mine = done.filter(r => r.a === a.n), cnt = (key, list) => list.map((p, i) => [p, mine.filter(r => (r[key] || []).includes(i)).length]).filter(x => x[1]).sort((x, y) => y[1] - x[1]).slice(0, 3);
    const bars = (arr) => arr.length ? arr.map(([p, n]) => `<div class="bar"><span>${esc(p)}</span><span>${n}명</span><div class="tr"><i style="width:${Math.round(n / Math.max(1, mine.length) * 100)}%"></i></div></div>`).join("") : `<div class="muted" style="font-size:15px">아직 없음</div>`;
    return `<div class="box" style="--c:${a.c}"><h3 style="color:${a.c}">${esc(a.name)}</h3><div class="lab" style="--c:${a.c}">가진 힘</div>${bars(cnt("powers", POWERS))}<div class="lab" style="--c:#666;margin-top:6px">한계</div>${bars(cnt("limits", LIMITS))}</div>`;
  }).join("");
  const sents = [1, 2, 3, 4].map(g => { const t = T(g), s = GRP[String(g)]; return `<div class="s" style="--c:${t.c};border-left-color:${t.c}"><small>${g}모둠 · ${esc(t.name)}</small>${s?.sentence ? esc(s.sentence) : `<span class="muted">아직 저장 전</span>`}</div>`; }).join("");
  $("#app").innerHTML = `<div class="wrap wide">
    <div class="tbar"><h1>지구촌 문제 해결 조사단 · 교사 화면${DEMO ? '<span class="demo-badge">데모</span>' : ""}</h1>
      <div class="stats"><span class="stat">제출<b>${done.length}</b>/${STUDENT_NOS.length}</span><span class="stat">조사 중<b>${doing.length}</b></span></div></div>
    ${listenErr ? `<div class="err">${listenErr === "perm" ? `Firestore 읽기 권한이 없어요. 규칙에 아래 내용을 넣어 주세요.<pre>${esc(RULES)}</pre>` : "서버에 연결하지 못했어요. 인터넷을 확인해 주세요."}</div>` : ""}
    <div class="flow"><span>개인 검색·조사<i>15′</i></span><span>모둠 협력 사슬 · ★<i>12′</i></span><span>전체 공유 · 일반화<i>8′</i></span><span>나의 실천 다짐<i>5′</i></span></div>
    <table class="matrix"><thead><tr><th class="rowh"></th>${head}</tr></thead><tbody>${rows}</tbody></table>
    <div class="sec-t" style="margin-top:18px">주체별 ‘가진 힘’과 ‘한계’ <small>일반화할 때 함께 봐요: 주체마다 가진 힘이 달라 서로 채워 줌</small></div>
    <div class="agg">${agg}</div>
    <div class="sec-t" style="margin-top:18px">모둠 한 문장</div><div class="sentences">${sents}</div>
    <div class="tools"><button class="btn ghost" id="tvb">${tv ? "보통 글씨" : "TV용 큰 글씨"}</button><button class="btn ghost" id="csv">CSV 내려받기</button>
      <a class="btn ghost" href="#print">종이 조사지 인쇄</a><a class="btn ghost" href="#group=1">모둠 화면 보기</a>
      <button class="btn ghost" id="del" style="margin-left:auto;color:var(--no)">${delArm ? "한 번 더 누르면 모두 지워져요" : "모든 기록 지우기"}</button></div></div>`;
  $("#tvb").onclick = () => { tv = !tv; renderTeacher(); };
  $("#csv").onclick = () => {
    const head = ["번호", "모둠", "문제", "주체", "상태", "사례 제목", "누가", "무엇을 했나요", "결과·숫자", "출처", "주소", "가진 힘", "한계", "나의 해결 방법", "함께할 주체", "까닭", "★"];
    const lines = [head].concat(RES.slice().sort((x, y) => x.g - y.g || x.a - y.a).map(r => [r.no, r.g, T(r.g).name, A(r.a)?.name, r.state, r.ctitle, r.cwho, r.cwhat, r.cres, r.csrc, r.curl, (r.powers || []).map(i => POWERS[i]).join("/"), (r.limits || []).map(i => LIMITS[i]).join("/"), r.idea, r.partner ? A(r.partner).name : "", r.why, r.star ? A(r.star).name : ""]));
    lines.push([]); [1, 2, 3, 4].forEach(g => lines.push([`${g}모둠 한 문장`, GRP[String(g)]?.sentence || ""]));
    const csv = "﻿" + lines.map(l => l.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = "지구촌_해결_조사_결과.csv"; a.click();
  };
  $("#del").onclick = async () => {
    if (!delArm){ delArm = 1; renderTeacher(); setTimeout(() => { if (delArm){ delArm = 0; if (location.hash === "#teacher") renderTeacher(); } }, 4000); return; }
    delArm = 0; try { await api.clear(); toast("모든 기록을 지웠어요"); } catch (e) { toast("지우지 못했어요", 2500); }
  };
}

/* ══════════════ 종이 조사지 (#print) ══════════════ */
let printBuilt = false;
function renderPrint(){
  document.body.classList.add("pmode");
  if (printBuilt) return; printBuilt = true;
  const ln = h => `<div class="ln" style="--h:${h}mm"></div>`;
  const fr = (k, h) => `<div class="fr"><span class="k">${k}</span>${ln(h)}</div>`;
  const pages = ACTORS.map(a => { const ex = EXAMPLES[a.n - 1].main, et = TOPICS[ex.topic - 1];
    return `<section class="pg" style="--c:${a.c};--t:${a.t}">
    <div class="band"><b>${esc(a.name)} 조사지</b><span>지구촌 문제 해결 조사단 · ${esc(a.hint)}</span></div>
    <div class="info">모둠 <span></span> 맡은 문제 <span style="min-width:40mm"></span> 이름 <span style="min-width:30mm"></span></div>
    <div class="exp"><div class="eh">① 예시 사례 <i style="background:${et.c};color:${et.on}">${esc(et.name)}</i></div>
      <div class="er"><span class="k">사례 제목</span><span>${esc(ex.title)}</span></div>
      <div class="er"><span class="k">누가</span><span>${esc(ex.who)}</span></div>
      <div class="er"><span class="k">무엇을 했나요</span><span>${esc(ex.what)}</span></div>
      <div class="er"><span class="k">결과·숫자</span><span>${esc(ex.res)}</span></div>
      <div class="er"><span class="k">출처</span><span>${esc(ex.src)}</span></div></div>
    <div class="srch"><div class="eh">② 우리 모둠 문제에서 ${esc(a.name)}의 노력을 검색해요 <small>예시와 다른 사례를 찾아요</small></div>
      <table>${TOPICS.map(t => `<tr><th style="background:${t.t}">${esc(t.name)}</th><td>${KEYWORDS[a.n - 1][t.n - 1].map(esc).join(" · ")}</td></tr>`).join("")}</table>
      <div class="tp2">${SEARCH_TIPS.map(esc).join(" / ")}</div></div>
    <div class="qq mine"><div class="x">③ 내가 찾은 사례</div>
      ${fr("사례 제목", 7.5)}${fr("누가", 7.5)}${fr("무엇을 했나요", 15)}${fr("결과·숫자", 7.5)}${fr("출처(이름·날짜)", 7.5)}</div>
    <div class="qq"><div class="x">④ ${esc(a.name)}${josa(a.name, "이", "가")} 가진 힘 (2개까지 ○)</div><div class="ck">${POWERS.map(p => `<span>○ ${esc(p)}</span>`).join("")}</div></div>
    <div class="qq"><div class="x">⑤ ${esc(a.name)}의 노력의 한계 (1~2개 ○)</div><div class="ck">${LIMITS.map(p => `<span>○ ${esc(p)}</span>`).join("")}</div></div>
    <div class="qq" style="flex:1"><div class="x">⑥ 내가 ${esc(a.name)}${josa(a.name, "이라면", "라면")} 우리 모둠 문제를 줄이기 위해 무엇을 할까요?</div><div style="font-size:9pt;color:#555">“나는 ${esc(a.short)}${josa(a.short, "으로서", "로서")} ~을/를 하겠다. 그러면 ~ 때문에 ~이/가 줄어든다.”</div>${ln(22.5)}</div>
    <div class="qq"><div class="x">⑦ 누구와 함께하면 더 효과적일까요? ${ACTORS.filter(x => x.n !== a.n).map(x => `○ ${esc(x.name)}`).join("  ")}</div>${fr("까닭", 7.5)}</div>
  </section>`; }).join("");
  const gpage = `<section class="pg" style="--c:#173F6B">
    <div class="band"><b>모둠 협력 사슬</b><span>모둠 <u style="display:inline-block;width:12mm"></u> · 맡은 문제 <u style="display:inline-block;width:40mm"></u></span></div>
    <div class="gcols">${ACTORS.map(a => `<div class="gc" style="--c:${a.c}"><div class="h">${esc(a.name)}</div><div class="b">
      <div>맡은 사람: </div><div>찾은 사례 (누가 · 무엇을)</div>${ln(30)}<div>나의 해결 방법</div>${ln(37.5)}<div>가진 힘 / 한계</div>${ln(15)}<div>함께할 주체</div>${ln(7.5)}<div>☆ 가장 효과적 (    표)</div></div></div>`).join("")}</div>
    <div class="qq"><div class="x">우리 모둠 한 문장</div><div style="font-size:9pt;color:#555">“○○ 문제를 해결하려면 개인은 ○○, 기업은 ○○, 국가는 ○○, 국제기구는 ○○ 해야 함. 함께해야 하는 까닭은 ○○ 때문임.”</div>${ln(30)}</div>
  </section>`;
  $("#pp").innerHTML = `<div class="pbar">종이 조사지 (주체별 4쪽 + 모둠 정리 1쪽) <button class="btn primary small" onclick="window.print()">인쇄하기</button><a href="#teacher">← 교사 화면</a></div>${pages}${gpage}`;
}

/* ══════════════ 라우팅 ══════════════ */
function render(){
  const h = location.hash;
  document.body.classList.remove("pmode", "tv");
  ["--tc", "--tt", "--ton", "--ac", "--at"].forEach(v => document.documentElement.style.removeProperty(v));
  if (h === "#print") return renderPrint();
  if (h === "#teacher") return askPw();
  const m = h.match(/^#group=(\d)/);
  if (m) return renderGroup(+m[1]);
  if (!S.step || !S.no || !S.g || !S.a) return renderStart();
  ({ 1: renderStep1, 2: renderStep2, 3: renderStep3, 4: renderDone })[S.step]?.();
}
function onData(){
  const h = location.hash;
  if (h === "#teacher" && (ss.get("ga_teacher") || DEMO)) renderTeacher();
  else if (/^#group=/.test(h)) drawBoard();
  else if (!S.step) renderStart();
}
addEventListener("hashchange", () => { sentDraft = null; render(); scrollTo(0, 0); });

(async () => {
  if (DEMO) api = demoApi();
  else { try { api = await firebaseApi(); } catch (e) { console.error(e); apiError = "load"; } }
  if (api){
    api.subscribe(list => { RES = list; listenErr = null; onData(); }, e => { listenErr = errKind(e); onData(); });
    api.subscribeGroups(o => { GRP = o; const h = location.hash; if (h === "#teacher") onData();
      else if (/^#group=/.test(h)) { const s = $("#savedAt"), gd = GRP[String(groupG)]; if (s && gd?.sentence) s.textContent = `저장됨${gd.by ? ` · ${gd.by}번` : ""}`;
        const ta = $("#sent"); if (ta && sentDraft == null && gd?.sentence && document.activeElement !== ta) ta.value = gd.sentence; } }, () => {});
  }
  render();
  if (!api) toast("저장 서버에 연결하지 못했어요. 선생님께 알려 주세요.", 4000);
})();
</script>
