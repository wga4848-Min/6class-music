<style>
  :root{
    --bg:#122622; --bg2:#0d1e1b; --card:#FBF3E3;
    --ink:#2B2318; --ink-soft:#5b5140;
    --gold:#D8A438; --ember:#C1440E; --teal:#2F7A76; --green:#2f9e44;
    --line:#e4d7b8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:radial-gradient(circle at 50% -10%, #1c3a33 0%, var(--bg) 55%, var(--bg2) 100%);
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    color:var(--ink); min-height:100vh;
    padding:16px 12px 60px;
    padding-top:calc(16px + env(safe-area-inset-top));
    padding-bottom:calc(60px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:520px;margin:0 auto;}
  .wrap.wide{max-width:800px;}

  .ticket{
    background:var(--card); border-radius:18px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
    position:relative; overflow:hidden; border:1px solid rgba(0,0,0,.06);
  }
  .ticket::before{
    content:""; position:absolute; top:0; left:0; right:0; height:6px;
    background:repeating-linear-gradient(90deg, var(--gold) 0 14px, transparent 14px 22px);
  }
  .ticket-pad{padding:22px 20px 20px;}

  .brand{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--ember);}
  .brand-title{font-size:12px;letter-spacing:3px;color:#a48a4a;text-transform:uppercase;font-weight:800;}
  h1{font-size:22px;margin:2px 0;letter-spacing:-.3px;font-weight:800;}
  .sub{color:var(--ink-soft);font-size:13px;margin:0 0 16px;}

  /* 연결 상태 표시 */
  .conn{
    display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;
    padding:5px 10px;border-radius:999px;margin-bottom:12px;
  }
  .conn.ok{background:#e5f6e8;color:#1c6b2c;}
  .conn.wait{background:#fff5df;color:#8a6110;}
  .conn.err{background:#ffeae2;color:#8f3308;}
  .conn .led{width:7px;height:7px;border-radius:50%;background:currentColor;}
  .conn.ok .led{animation:pulse 1.8s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.25;}}

  .bigbtn-row{display:grid;gap:12px;margin-top:18px;}
  .bigbtn{
    display:block;width:100%;text-align:left;padding:18px;border-radius:14px;border:none;
    cursor:pointer;font-size:16px;font-weight:800;color:#fff;
    box-shadow:0 6px 0 rgba(0,0,0,.18);transition:transform .08s ease;
  }
  .bigbtn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.18);}
  .bigbtn small{display:block;font-weight:500;font-size:12.5px;opacity:.85;margin-top:3px;}
  .bigbtn.student{background:linear-gradient(135deg,var(--teal),#1d5652);}
  .bigbtn.teacher{background:linear-gradient(135deg,var(--ember),#8f3308);}

  input[type=text],textarea{
    width:100%;padding:13px 14px;border-radius:10px;border:1.5px solid var(--line);
    font-size:15px;background:#fffdf7;color:var(--ink);font-family:inherit;
  }
  input:focus,textarea:focus{outline:2px solid var(--gold);border-color:var(--gold);}
  .cta{margin-top:12px;width:100%;padding:14px;border:none;border-radius:10px;background:var(--ink);color:#fff;font-weight:800;font-size:15px;cursor:pointer;}
  .link{background:none;border:none;color:var(--ink-soft);text-decoration:underline;font-size:12.5px;cursor:pointer;padding:0;}
  .footlink{text-align:center;margin-top:18px;}

  /* 공지 배너 */
  .notice-banner{
    background:linear-gradient(135deg,#3d2b12,#1f1608);color:#ffeec2;
    border-radius:14px;padding:14px 16px;margin-bottom:14px;
    border:1.5px solid var(--gold);
  }
  .notice-banner .nlabel{font-size:11px;letter-spacing:2px;font-weight:800;color:var(--gold);margin-bottom:5px;}
  .notice-banner .ntext{font-size:14.5px;font-weight:700;line-height:1.5;white-space:pre-wrap;}
  .notice-banner .ntime{font-size:11px;opacity:.65;margin-top:6px;}
  .notice-banner.fresh{animation:noticeIn .5s ease;}
  @keyframes noticeIn{0%{transform:scale(.94);opacity:0;}100%{transform:scale(1);opacity:1;}}

  .status-card{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:14px;margin-bottom:14px;background:#fffdf7;border:1.5px dashed var(--line);}
  .stamp-badge{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none;border:2px solid rgba(0,0,0,.15);transform:rotate(-6deg);}
  .status-text .loc{font-weight:800;font-size:16px;}
  .status-text .time{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .status-empty{color:var(--ink-soft);font-size:13.5px;}

  .help-btn{
    width:100%;padding:14px;border-radius:12px;border:2px solid var(--ember);
    background:#fff2ea;color:var(--ember);font-weight:800;font-size:14.5px;cursor:pointer;margin-bottom:14px;
  }
  .help-btn.active{background:var(--ember);color:#fff;animation:pulse 1.4s infinite;}

  .toast{
    position:fixed;left:50%;top:26px;transform:translateX(-50%) scale(.8);
    background:var(--ink);color:#fff;padding:14px 22px;border-radius:14px;
    font-weight:800;font-size:15px;box-shadow:0 10px 24px rgba(0,0,0,.4);
    opacity:0;pointer-events:none;transition:all .25s ease;z-index:200;
    display:flex;align-items:center;gap:10px;max-width:90vw;
  }
  .toast.show{opacity:1;transform:translateX(-50%) scale(1);top:40px;}
  .toast .stampmark{width:28px;height:28px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;font-size:15px;animation:stampIn .35s ease;}
  @keyframes stampIn{0%{transform:scale(2.2) rotate(-25deg);opacity:0;}60%{transform:scale(.9) rotate(4deg);opacity:1;}100%{transform:scale(1) rotate(-8deg);opacity:1;}}

  .num-badge{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.06);font-size:11px;font-weight:900;flex:none;margin-right:6px;}

  details.cat{margin-bottom:10px;border-radius:12px;overflow:hidden;border:1px solid rgba(0,0,0,.08);}
  details.cat summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:800;font-size:14.5px;display:flex;align-items:center;gap:8px;color:#fff;}
  details.cat summary::-webkit-details-marker{display:none;}
  details.cat summary .arrow{margin-left:auto;font-size:12px;opacity:.8;}
  .cat-body{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#fffdf7;}
  .loc-btn{padding:10px 8px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink);text-align:left;display:flex;align-items:center;transition:.12s;}
  .loc-btn:active{transform:scale(.96);}
  .custom-row{display:flex;gap:8px;margin-top:8px;}
  .custom-row input{flex:1;}
  .custom-row button{padding:0 16px;border-radius:9px;border:none;background:var(--ink);color:#fff;font-weight:800;cursor:pointer;}
  .searchbox{margin-bottom:14px;}
  .maplink-btn{width:100%;padding:12px;border-radius:10px;border:1.5px dashed var(--gold);background:#fff8e8;color:#8a6110;font-weight:800;font-size:13.5px;cursor:pointer;margin-bottom:14px;}

  .th-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .th-header h1{margin:0;flex:1;}
  .iconbtn{background:#fffdf7;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink);}
  .iconbtn.danger{border-color:var(--ember);color:var(--ember);}
  .tabrow{display:flex;gap:8px;margin-bottom:14px;}
  .tabbtn{flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:#fffdf7;font-weight:800;font-size:13.5px;cursor:pointer;color:var(--ink-soft);}
  .tabbtn.on{background:var(--ink);color:#fff;border-color:var(--ink);}

  .chiprow{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px;}
  .chip{padding:7px 12px;border-radius:999px;font-size:12.5px;font-weight:800;cursor:pointer;color:#fff;opacity:.5;border:none;}
  .chip.on{opacity:1;box-shadow:0 3px 8px rgba(0,0,0,.25);}
  .chip.all{background:var(--ink);}

  .summary-strip{display:flex;justify-content:space-between;background:#fffdf7;border:1.5px dashed var(--line);border-radius:12px;padding:12px 16px;margin-bottom:14px;font-size:12.5px;color:var(--ink-soft);text-align:center;}
  .summary-strip b{color:var(--ink);font-size:18px;display:block;}

  .stu-card{display:flex;align-items:center;gap:12px;background:#fffdf7;border-radius:12px;padding:12px 14px;margin-bottom:9px;border-left:6px solid var(--gold);}
  .stu-card.helping{background:#fff2ea;border-left-color:var(--ember);}
  .stu-emoji{font-size:22px;width:34px;text-align:center;flex:none;}
  .stu-name{font-weight:800;font-size:14.5px;}
  .stu-loc{font-size:13px;color:var(--ink-soft);}
  .stu-time{margin-left:auto;text-align:right;font-size:11.5px;font-weight:700;flex:none;}
  .dotstat{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px;}

  .alert-box{background:#fff2ea;border:2px solid var(--ember);border-radius:14px;padding:14px 16px;margin-bottom:14px;}
  .alert-box h3{margin:0 0 8px;font-size:14.5px;color:#8f3308;}
  .alert-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid rgba(193,68,14,.2);font-size:13.5px;}
  .alert-row:last-child{border-bottom:none;}
  .alert-row button{padding:5px 10px;border-radius:7px;border:none;background:var(--ember);color:#fff;font-size:11.5px;font-weight:800;cursor:pointer;}

  .confirm-banner{background:#fff2ea;border:1.5px solid var(--ember);border-radius:12px;padding:14px;margin-bottom:14px;}
  .confirm-banner p{margin:0 0 10px;font-size:13.5px;font-weight:700;color:#7a2b0e;}
  .confirm-banner .row{display:flex;gap:8px;}
  .confirm-banner button{flex:1;padding:10px;border-radius:8px;border:none;font-weight:800;cursor:pointer;}
  .btn-cancel{background:#eee;color:#333;}
  .btn-confirm{background:var(--ember);color:#fff;}

  .empty-state{text-align:center;color:var(--ink-soft);padding:36px 10px;font-size:13.5px;}
  .loading{text-align:center;color:var(--ink-soft);font-size:13px;padding:20px;}

  .map-container{position:relative;width:100%;border-radius:14px;overflow:hidden;border:2px solid var(--line);background:#eee;}
  .map-img{width:100%;display:block;}
  .map-pin{position:absolute;transform:translate(-50%,-50%);width:42px;height:42px;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
  .map-pin .dot{width:25px;height:25px;border-radius:50%;background:var(--pin-color,#333);color:#fff;font-size:10.5px;font-weight:900;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.45);transition:transform .1s ease;position:relative;}
  .map-pin:active .dot{transform:scale(1.45);}
  .map-pin.mine .dot{box-shadow:0 0 0 5px rgba(216,164,56,.6),0 2px 6px rgba(0,0,0,.45);}
  .dot.confirm{animation:dotConfirm .55s ease;}
  @keyframes dotConfirm{0%{transform:scale(1);}35%{transform:scale(1.8);box-shadow:0 0 0 8px rgba(216,164,56,.5);}100%{transform:scale(1);}}
  .map-pin .pin-count{position:absolute;top:-9px;right:-9px;background:#fff;color:var(--ember);border-radius:999px;min-width:17px;height:17px;padding:0 3px;font-size:10px;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--ember);font-weight:900;}
  .map-legend{font-size:11.5px;color:var(--ink-soft);margin-top:10px;line-height:1.6;}
  .pin-detail-panel{margin-top:12px;background:#fffdf7;border:1.5px dashed var(--line);border-radius:12px;padding:12px 14px;min-height:44px;font-size:13px;}
  .pin-detail-panel .ptitle{font-weight:800;margin-bottom:6px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(10,20,18,.75);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:20px 12px;overflow-y:auto;}
  .modal-box{background:var(--card);border-radius:16px;max-width:660px;width:100%;padding:18px;margin-top:10px;}
  .modal-close-row{display:flex;justify-content:flex-end;margin-bottom:8px;}

  .setup-warn{background:#fff2ea;border:2px solid var(--ember);border-radius:14px;padding:18px;}
  .setup-warn h2{margin:0 0 10px;font-size:17px;color:#8f3308;}
  .setup-warn ol{margin:0;padding-left:20px;font-size:13.5px;line-height:1.8;}
  .setup-warn code{background:#2b2318;color:#ffeec2;padding:2px 6px;border-radius:4px;font-size:12px;}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<div id="toast" class="toast"></div>
<div id="mapModal" class="modal-overlay">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-close-row"><button class="iconbtn" onclick="closeMapModal()">✕ 닫기</button></div>

  </div>
</div>

const LS = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return (window.__mem||{})[k]||null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ window.__mem=window.__mem||{}; window.__mem[k]=v; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){ if(window.__mem) delete window.__mem[k]; } }
};

/* ── 유틸 ── */
const esc = s => String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function tsMs(t){ if(!t) return 0; if(typeof t==='number') return t; if(t.toMillis) return t.toMillis(); return 0; }
function timeAgo(t){
  const ms = tsMs(t); if(!ms) return '동기화 중';
  const d = Math.floor((Date.now()-ms)/1000);
  if(d<10) return '방금 전'; if(d<60) return d+'초 전';
  if(d<3600) return Math.floor(d/60)+'분 전'; return Math.floor(d/3600)+'시간 전';
}
function freshColor(t){
  const ms = tsMs(t); if(!ms) return '#999';
  const m=(Date.now()-ms)/60000;
  return m<10?'#2f9e44':(m<30?'#D8A438':'#C1440E');
}
function showToast(emoji,text){
  const t=document.getElementById('toast');
  t.innerHTML=`<span class="stampmark">${emoji}</span><span>${esc(text)}</span>`;
  t.classList.add('show');
  clearTimeout(window.__tt); window.__tt=setTimeout(()=>t.classList.remove('show'),2400);
}
function connBadge(){
  const map={ok:['ok','실시간 연결됨'],wait:['wait','연결 중…'],err:['err','연결 끊김 · 오프라인']};
  const [cls,txt]=map[connState]||map.wait;
  return `<div class="conn ${cls}"><span class="led"></span>${txt}</div>`;
}

/* ── 실시간 구독 ── */
function startListeners(){
  if(!fbReady) return;
  if(unsubStudents) unsubStudents();
  if(unsubNotice) unsubNotice();

  unsubStudents = onSnapshot(studentsCol(),
    snap => {
      const next = {};
      snap.forEach(d => next[d.id] = d.data());
      allStudents = next;
      connState = 'ok';
      rerenderLive();
    },
    err => { connState='err'; console.error(err); rerenderLive(); }
  );

  unsubNotice = onSnapshot(noticeDoc(),
    snap => {
      currentNotice = snap.exists() ? snap.data() : null;
      if(role==='student' && currentNotice && currentNotice.text){
        const key = String(tsMs(currentNotice.at));
        if(key !== lastNoticeAt && key !== '0'){
          lastNoticeAt = key; LS.set('gj_lastNotice', key);
          showToast('📢','선생님 공지가 도착했어요!');
          if(navigator.vibrate) navigator.vibrate([120,60,120]);
        }
      }
      rerenderLive();
    },
    err => console.error(err)
  );
}

/* ── 체크인 ── */
async function doCheckin(item, ev){
  if(ev&&ev.currentTarget){
    const d=ev.currentTarget.querySelector('.dot');
    if(d){ d.classList.remove('confirm'); void d.offsetWidth; d.classList.add('confirm'); }
  }
  try{
    await setDoc(studentDoc(myId), {
      name: myName, locName: item.name, num: item.num||'', key: item.key||null,
      catId: item.catId, catName: item.catName, emoji: item.emoji, color: item.color,
      at: serverTimestamp()
    }, { merge:true });
    showToast(item.emoji, `${item.name} 체크인 완료!`);
  }catch(e){
    showToast('⚠️','저장 실패 · 신호를 확인해주세요');
    console.error(e);
  }
}
async function checkinCustom(){
  const el=document.getElementById('customLoc'); const v=el.value.trim();
  if(!v){ showToast('✋','위치를 입력해주세요'); return; }
  await doCheckin({catId:'custom',catName:'기타',emoji:'📍',color:'#556B2F',num:'',name:v,key:null});
  el.value='';
}
async function toggleHelp(){
  const me=allStudents[myId]; const next=!(me&&me.help);
  try{
    await setDoc(studentDoc(myId), { name:myName, help:next, helpAt:serverTimestamp() }, {merge:true});
    showToast(next?'🆘':'✅', next?'선생님께 알렸어요. 그 자리에서 기다리세요!':'도움 요청을 취소했어요');
  }catch(e){ showToast('⚠️','전송 실패 · 신호를 확인해주세요'); }
}

function filterLoc(q){
  q=q.trim().toLowerCase();
  document.querySelectorAll('#catList .loc-btn').forEach(b=>{
    b.style.display=(!q||b.dataset.s.includes(q))?'':'none';
  });
  document.querySelectorAll('#catList details.cat').forEach(d=>{
    if(!q){ d.style.display=''; return; }
    const vis=[...d.querySelectorAll('.loc-btn')].some(b=>b.style.display!=='none');
    d.open=vis; d.style.display=vis?'':'none';
  });
}

function paintTeacherLive(){
  const entries=Object.entries(allStudents).map(([id,d])=>({id,...d}));

  const cn=document.getElementById('curNotice');
  if(cn) cn.innerHTML = currentNotice&&currentNotice.text
    ? `현재 게시 중: "${esc(currentNotice.text)}" (${timeAgo(currentNotice.at)})` : '게시 중인 공지 없음';

  const helps=entries.filter(e=>e.help);
  const alertSlot=document.getElementById('alertSlot');
  if(alertSlot){
    alertSlot.innerHTML = helps.length ? `<div class="alert-box">
      <h3>🆘 도움 요청 ${helps.length}건</h3>
      ${helps.map(h=>`<div class="alert-row">
        <span><b>${esc(h.name)}</b> · ${esc(h.locName||'위치 미체크인')}</span>
        <button onclick="clearHelp('${h.id}')">확인 완료</button></div>`).join('')}
    </div>` : '';
  }

  if(teacherView==='list'){
    const counts={}; entries.forEach(e=>counts[e.catId]=(counts[e.catId]||0)+1);
    const cats=[...ATTRACTIONS,...FOOD_CATEGORIES];
    const chipRow=document.getElementById('chipRow');
    if(chipRow) chipRow.innerHTML=`<div class="chip all ${teacherFilter===null?'on':''}" onclick="setFilter(null)">전체 ${entries.length}</div>`+
      cats.map(c=>`<div class="chip ${teacherFilter===c.id?'on':''}" style="background:${c.color}" onclick="setFilter('${c.id}')">${c.emoji} ${c.name} ${counts[c.id]||0}</div>`).join('');

    const fresh=entries.filter(e=>(Date.now()-tsMs(e.at))/60000<10).length;
    const stale=entries.filter(e=>tsMs(e.at)&&(Date.now()-tsMs(e.at))/60000>=30).length;
    const ss=document.getElementById('summaryStrip');
    if(ss) ss.innerHTML=`<div><b>${entries.length}</b>접속 인원</div><div><b style="color:#2f9e44">${fresh}</b>10분 내 갱신</div><div><b style="color:#C1440E">${stale}</b>30분 이상 미갱신</div><div><b style="color:#C1440E">${helps.length}</b>도움 요청</div>`;

    const q=(document.getElementById('tSearch')?.value||'').trim().toLowerCase();
    let f=entries;
    if(teacherFilter) f=f.filter(e=>e.catId===teacherFilter);
    if(q) f=f.filter(e=>(e.name||'').toLowerCase().includes(q));
    f.sort((a,b)=>tsMs(b.at)-tsMs(a.at));
    const box=document.getElementById('listBox');
    if(box) box.innerHTML = f.length ? f.map(e=>`
      <div class="stu-card ${e.help?'helping':''}" style="border-left-color:${e.color||'#ccc'}">
        <div class="stu-emoji">${e.help?'🆘':(e.emoji||'📍')}</div>
        <div><div class="stu-name">${esc(e.name)}</div>
        <div class="stu-loc">${e.num?('#'+e.num+' '):''}${esc(e.locName||'미체크인')} <span style="opacity:.6">· ${esc(e.catName||'')}</span></div></div>
        <div class="stu-time"><span class="dotstat" style="background:${freshColor(e.at)}"></span>${timeAgo(e.at)}</div>
      </div>`).join('')
      : `<div class="empty-state">${entries.length?'조건에 맞는 학생이 없어요.':'아직 체크인한 학생이 없어요.'}</div>`;
  } else {
    const counts={}; entries.forEach(e=>{ if(e.key) counts[e.key]=(counts[e.key]||0)+1; });
    const pins=FLAT_ITEMS.map(it=>{
      const c=counts[it.key]||0;
      return `<div class="map-pin" style="left:${it.x}%;top:${it.y}%;--pin-color:${it.color}" onclick="pinDetail('${it.key}')">
        <div class="dot"><span>${it.num}</span>${c>0?`<div class="pin-count">${c}</div>`:''}</div></div>`;
    }).join('');
    const mb=document.getElementById('mapBox');
    if(mb) mb.innerHTML=`<div class="map-container"><img class="map-img" src="${MAP_IMG_SRC}" alt="경주월드 가이드맵">${pins}</div>
      <div id="pinPanel" class="pin-detail-panel">지도 위 번호를 눌러 해당 지점의 학생 명단을 확인하세요.</div>`;
  }
}

function setFilter(id){ teacherFilter = (teacherFilter===id)?null:id; paintTeacherLive(); }
function pinDetail(key){
  const p=document.getElementById('pinPanel'); if(!p) return;
  const item=FLAT_ITEMS.find(i=>i.key===key);
  const who=Object.entries(allStudents).filter(([id,d])=>d.key===key).sort((a,b)=>tsMs(b[1].at)-tsMs(a[1].at));
  p.innerHTML = who.length
    ? `<div class="ptitle">#${item.num} ${esc(item.name)} · ${who.length}명</div>`+
      who.map(([id,d])=>`<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line)"><span>${esc(d.name)}</span><span style="color:${freshColor(d.at)}">${timeAgo(d.at)}</span></div>`).join('')
    : `<div class="ptitle">#${item.num} ${esc(item.name)}</div><div class="status-empty">현재 이 위치에 체크인한 학생이 없어요.</div>`;
}
async function sendNotice(){
  const el=document.getElementById('noticeInput'); const v=el.value.trim();
  if(!v){ showToast('✋','내용을 입력해주세요'); return; }
  try{ await setDoc(noticeDoc(),{text:v,at:serverTimestamp()}); el.value=''; showToast('📢','전체 공지를 보냈습니다'); }
  catch(e){ showToast('⚠️','전송 실패'); }
}
async function clearNotice(){
  try{ await setDoc(noticeDoc(),{text:'',at:serverTimestamp()}); showToast('✅','공지를 내렸습니다'); }catch(e){}
}
async function clearHelp(id){
  try{ await updateDoc(studentDoc(id),{help:false}); }catch(e){}
}
function askReset(){
  document.getElementById('resetBox').innerHTML=`<div class="confirm-banner">
    <p>⚠️ 모든 학생의 체크인 기록이 삭제됩니다. 계속할까요?</p>
    <div class="row"><button class="btn-cancel" onclick="cancelReset()">취소</button>
    <button class="btn-confirm" onclick="doReset()">전체 초기화</button></div></div>`;
}
function cancelReset(){ document.getElementById('resetBox').innerHTML=''; }
async function doReset(){
  try{
    const snap=await getDocs(studentsCol());
    const b=writeBatch(db); snap.forEach(d=>b.delete(d.ref)); await b.commit();
    showToast('🗑','초기화되었습니다');
  }catch(e){ showToast('⚠️','초기화 실패'); }
  document.getElementById('resetBox').innerHTML='';
}

/* ── 지도 모달 (학생) ── */
function openMapModal(mode){
  document.getElementById('mapModal').style.display='flex';
  paintMapModal(mode);
}
function closeMapModal(){ document.getElementById('mapModal').style.display='none'; }
function paintMapModal(mode){
  const me=allStudents[myId];
  const myKey=me?me.key:null;
  const pins=FLAT_ITEMS.map(it=>`
    <div class="map-pin ${it.key===myKey?'mine':''}" style="left:${it.x}%;top:${it.y}%;--pin-color:${it.color}"
      onclick='doCheckin(${JSON.stringify({catId:it.catId,catName:it.catName,emoji:it.emoji,color:it.color,num:it.num,name:it.name,key:it.key}).replace(/'/g,"&#39;")}, event)'>
      <div class="dot"><span>${it.num}</span></div></div>`).join('');
  document.getElementById('mapModalBody').innerHTML=`
    <h1 style="font-size:18px;margin-bottom:8px;">가이드맵</h1>
    <div class="map-container"><img class="map-img" src="${MAP_IMG_SRC}" alt="경주월드 가이드맵">${pins}</div>
    <div class="map-legend">📍 번호를 누르면 바로 체크인됩니다. 매점 · 편의시설은 목록에서 체크인해주세요.</div>`;
}

/* ── 역할/이름 ── */
async function pickRole(r){
  if(r==='teacher'){
    const pin=prompt('교사 비밀번호를 입력하세요');
    if(pin!==TEACHER_PIN){ showToast('🔒','비밀번호가 올바르지 않습니다'); return; }
  }
  role=r; LS.set('gj_role',r); render(); startListeners();
}
async function resetRole(){
  if(role==='student'){ try{ await deleteDoc(studentDoc(myId)); }catch(e){} }
  role=null; myName=null; LS.del('gj_role'); LS.del('gj_name'); render();
}
function submitName(){
  const v=document.getElementById('nameInput').value.trim();
  if(!v){ showToast('✋','이름을 입력해주세요'); return; }
  myName=v; LS.set('gj_name',v); render();
}
async function resetName(){
  try{ await deleteDoc(studentDoc(myId)); }catch(e){}
  myName=null; LS.del('gj_name'); render();
}

/* ── 전역 노출 ── */
Object.assign(window,{pickRole,resetRole,submitName,resetName,doCheckin,checkinCustom,
  toggleHelp,filterLoc,openMapModal,closeMapModal,setTeacherView,setFilter,pinDetail,
  sendNotice,clearNotice,clearHelp,askReset,cancelReset,doReset,paintTeacherLive});

render();
if(fbReady) startListeners();
</script>
</body>
</html>
