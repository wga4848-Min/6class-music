<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>비례 용사 키우기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<style>
/* Layout: one-screen game shell — sticky top bar + scrolling stage; chunky ink-outlined "sticker" panels over a sky dotted with ratio colons. Single bright game world (light only, by choice). */
:root{
  color-scheme: light;
  --ink:#22305A; --ink-2:#55618A; --line:#D5DEEB;
  --sky:#9AD6F2; --sky-2:#CDEEFB;
  --paper:#FFFDF7; --paper-2:#EEF4FA;
  --gold:#FFC93C; --gold-2:#E9A400; --gold-3:#FFF4CF;
  --leaf:#34B97A; --leaf-2:#DDF5E8;
  --azure:#3F8CFF; --azure-2:#E3EEFF;
  --berry:#F25267; --berry-2:#FFE4E7;
  --f-display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --night:#2E2558; --night-2:#C9C2F0;
  --r:18px; --shadow:0 5px 0 var(--ink);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background-color:var(--sky);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(circle at 50% 36%, rgba(255,255,255,.55) 0 2.6px, transparent 3.2px),radial-gradient(circle at 50% 64%, rgba(255,255,255,.55) 0 2.6px, transparent 3.2px);
  background-size:48px 44px}
button{font:inherit}
.app{height:100%;display:flex;flex-direction:column}
.top{flex:none;display:flex;align-items:center;gap:10px;background:var(--paper);border-bottom:3px solid var(--ink);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative;z-index:5}
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:20px 44px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto}
.logo{font-family:var(--f-display);font-size:24px;white-space:nowrap}
.logo .cl,.big-title .cl{color:var(--gold-2);margin:0 .08em}
.vtitle{font-family:var(--f-display);font-size:21px;min-width:0;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden}
.vtitle .vt{overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.pill{flex:none;display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px;border:2.5px solid var(--ink);border-radius:999px;background:var(--paper-2);font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums}
.pill.coin{background:var(--gold-3)}
.pill.bump{animation:bump .45s}
.icon-btn{flex:none;width:42px;height:42px;display:grid;place-items:center;border:2.5px solid var(--ink);border-radius:12px;background:var(--paper);color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--ink);padding:0}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.ic{width:22px;height:22px;display:block;flex:none}
.ic.sm{width:17px;height:17px;display:inline-block;vertical-align:-3px}
.chip{display:inline-block;padding:1px 10px;border-radius:999px;background:var(--cc);color:#fff;font-family:var(--f-display);font-size:15px;border:2px solid var(--ink);flex:none}
@media (max-width:480px){.pill.lv{display:none}.logo{font-size:21px}.vtitle{font-size:18px}}

/* shared */
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow)}
.h2{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0;text-wrap:balance}
.eyebrow{font-family:var(--f-display);font-size:14px;letter-spacing:.06em;color:var(--ink-2)}
.note{margin:0;font-size:15px;color:var(--ink-2)}
.center{text-align:center}
.row{display:flex;flex-wrap:wrap;gap:10px}
.row.center{justify-content:center}
.btn{font-family:var(--f-display);font-size:19px;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:8px 18px;min-height:50px;box-shadow:0 4px 0 var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .06s,box-shadow .06s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.gold{background:var(--gold)}
.btn.big{font-size:22px;min-height:58px;padding:10px 26px}
.btn.wide{width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn small{font-size:14px;opacity:.75}
button:focus-visible,input:focus-visible{outline:3px dashed var(--azure);outline-offset:3px}
.bar{height:14px;border:2.5px solid var(--ink);border-radius:999px;background:var(--paper-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:999px;transition:width .5s}
.bar.sm{height:11px}
.hero{display:block;width:100%;height:auto;overflow:visible}
.hero.clip{overflow:hidden}
.bob{animation:bob 2.6s ease-in-out infinite}
.hop{animation:hop 1.8s ease-in-out infinite}
.hero.jump .bob{animation:jump .6s ease-out}
.thumb{width:100%;height:100%;display:block}
.locked .thumb{filter:brightness(0);opacity:.25}
.stage-sky{border:2.5px solid var(--ink);border-radius:14px;background:linear-gradient(180deg,var(--sky-2) 0%,#fff 64%,#D8F2E4 64%,#BFE9D2 100%);padding:8px 8% 0;display:flex;justify-content:center}
.stage-sky .hero{max-width:290px}

/* title */
.title-v{display:grid;gap:20px}
.hero-banner{text-align:center}
.big-title{font-family:var(--f-display);font-weight:400;font-size:clamp(42px,8vw,68px);line-height:1.05;margin:0;text-shadow:0 4px 0 #fff}
.big-title small{display:inline-block;font-size:.5em;vertical-align:middle;background:var(--ink);color:#fff;text-shadow:none;border-radius:999px;padding:2px 16px;margin-left:8px}
.sub{margin:10px 0 0;font-size:17px}
.warn{margin:0;background:var(--berry-2);border:2.5px solid var(--berry);border-radius:12px;padding:10px 14px}
.pick{padding:18px;display:grid;gap:14px}
.hero-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.hero-card{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 8px 12px;border:3px solid var(--ink);border-radius:16px;background:linear-gradient(var(--sky-2),var(--paper) 70%);box-shadow:0 4px 0 var(--ink);cursor:pointer;color:var(--ink)}
.hero-card .hero{max-width:126px}
.hero-card:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.hc-name{font-family:var(--f-display);font-size:19px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hc-meta{font-size:14px;color:var(--ink-2)}
.hero-card.add{justify-content:center;background:var(--paper-2);border-style:dashed;min-height:190px}
.plus{font-family:var(--f-display);font-size:54px;line-height:1}
.newform{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr);gap:22px;padding:20px;align-items:center}
.nf-fields{display:grid;gap:10px}
.lbl{font-family:var(--f-display);font-size:16px;color:var(--ink-2)}
.inp{font:inherit;font-size:20px;padding:12px 14px;border:3px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);width:100%}
.swatches{display:flex;gap:12px;flex-wrap:wrap}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);background:var(--sw);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 4px var(--paper),0 0 0 7px var(--ink)}
.seg{display:inline-flex;justify-self:start;max-width:100%;border:3px solid var(--ink);border-radius:14px;overflow:hidden;box-shadow:0 4px 0 var(--ink)}
.segb{font-family:var(--f-display);font-size:19px;min-height:50px;padding:8px 26px;border:0;background:var(--paper);color:var(--ink);cursor:pointer}
.segb+.segb{border-left:3px solid var(--ink)}
.segb.on{background:var(--ink);color:#fff}
.look{padding:16px 18px;display:grid;gap:12px}
.look-g{display:grid;grid-template-columns:repeat(2,minmax(0,180px));gap:12px}
.look-g .ithumb{background:linear-gradient(var(--sky-2),#fff);padding:4px}
@media (max-width:560px){.newform{grid-template-columns:1fr}.newform .stage-sky{max-width:240px;width:100%;margin:0 auto}}

/* home */
.home{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:22px;align-items:start}
.stage{padding:16px;display:grid;gap:12px}
.nameplate{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap}
.np-title{font-family:var(--f-display);font-size:15px;background:var(--ink);color:#fff;border-radius:999px;padding:2px 12px}
.np-name{font-family:var(--f-display);font-size:28px;line-height:1.2}
.xp-top{display:flex;justify-content:space-between;font-family:var(--f-display);font-size:16px;margin-bottom:4px;font-variant-numeric:tabular-nums}
.xp .bar i{background:var(--azure)}
.side{display:grid;gap:16px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stat{display:flex;align-items:center;gap:12px;padding:12px 14px}
.stat .ic{width:40px;height:40px}
.stat b{display:block;font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat b small{font-size:17px;color:var(--ink-2)}
.stat span{font-size:14px;color:var(--ink-2)}
.goal{display:flex;gap:14px;align-items:center;padding:12px 16px;background:#FFF8DE}
.goal-thumb{width:78px;height:78px;flex:none;border:2.5px solid var(--ink);border-radius:14px;background:#fff;padding:6px}
.goal-body{display:grid;gap:3px;min-width:0;flex:1}
.goal-body b{font-family:var(--f-display);font-weight:400;font-size:22px}
.goal-body span{font-size:14px;color:var(--ink-2)}
.goal .bar i{background:var(--gold)}
.menu{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.menu .mbtn:not(.gold):not(.dgbtn){flex-direction:column;justify-content:center;text-align:center;gap:6px;padding:14px 8px}
.mbtn{display:flex;align-items:center;gap:12px;padding:14px;border:3px solid var(--ink);border-radius:18px;background:var(--paper);box-shadow:0 5px 0 var(--ink);cursor:pointer;text-align:left;color:var(--ink)}
.mbtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.mbtn.gold{grid-column:1/-1;background:var(--gold);padding:16px 20px}
.mbtn .mic{width:48px;height:48px;flex:none}
.mbtn.gold .mic{width:58px;height:58px}
.mbtn b{display:block;font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.2}
.mbtn.gold b{font-size:30px}
.mbtn small{font-size:14px;color:var(--ink-2)}
@media (max-width:820px){.home{grid-template-columns:1fr}.home .stage-sky .hero{max-width:210px}}
@media (max-width:480px){.menu .mbtn:not(.gold):not(.dgbtn) small{display:none}.mbtn .mic{width:40px;height:40px}.mbtn b{font-size:19px}.stat{padding:10px}.stat .ic{width:32px;height:32px}.stat b{font-size:25px}}

/* chapter map */
.ch-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:18px}
.ch-card{grid-column:span 2;padding:0;overflow:hidden;text-align:left;cursor:pointer;color:var(--ink);display:flex;flex-direction:column}
.ch-card:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.ch-head{display:flex;justify-content:space-between;align-items:center;padding:9px 16px;background:var(--cc);color:#fff;font-family:var(--f-display);font-size:18px;border-bottom:3px solid var(--ink)}
.ch-body{padding:14px 16px 16px;display:grid;gap:8px}
.ch-t{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.2}
.ch-d{font-size:15px;color:var(--ink-2)}
.ch-rw{display:flex;gap:10px;align-items:center;margin-top:4px;padding:8px;border-radius:12px;background:var(--paper-2)}
.ch-rw.got{background:var(--gold-3)}
.rw-thumb{width:52px;height:52px;flex:none;border:2px solid var(--ink);border-radius:10px;background:#fff;padding:4px}
.ch-rw small{display:block;font-size:13px;color:var(--ink-2)}
.ch-rw b{font-family:var(--f-display);font-weight:400;font-size:17px}
@media (max-width:900px){.ch-grid{grid-template-columns:1fr 1fr}.ch-card{grid-column:auto}}
@media (max-width:600px){.ch-grid{grid-template-columns:1fr}}

/* chapter */
.chv{display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.3fr);gap:22px;align-items:start}
.concept{padding:18px 20px;display:grid;gap:12px;border-top-width:12px;border-top-color:var(--cc)}
.sum{margin:0;padding-left:22px;display:grid;gap:6px;font-size:17px}
.sum li::marker{color:var(--cc)}
.ex{display:grid;gap:4px;background:var(--paper-2);border-radius:12px;padding:12px 14px}
.ex-line{font-family:var(--f-display);font-size:20px}
.terms{width:100%;max-width:340px;margin:0 auto;display:block}
.terms text{font-family:var(--f-display);text-anchor:middle}
.qsec{display:grid;gap:14px}
.qsec-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;font-family:var(--f-display);font-size:20px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-family:var(--f-body);font-size:14px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);margin-right:4px;vertical-align:-1px}
.dot.d1{background:var(--leaf)}.dot.d2{background:var(--azure)}.dot.d3{background:var(--berry)}
.qgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.qcell{position:relative;aspect-ratio:1;max-width:100%;border:3px solid var(--ink);border-radius:14px;background:var(--paper);box-shadow:0 4px 0 var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--ink);padding:0}
.qcell:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.qn{font-family:var(--f-display);font-size:24px;line-height:1}
.qd{display:flex;gap:3px}
.qd i{width:8px;height:8px;border-radius:50%;background:currentColor}
.qcell.d1 .qd{color:var(--leaf)}.qcell.d2 .qd{color:var(--azure)}.qcell.d3 .qd{color:var(--berry)}
.qcell.ok{background:#FFE89A}
.qcell.try{background:var(--azure-2)}
.qcell.sol{background:var(--berry-2)}
.qok{position:absolute;top:-9px;right:-9px;width:26px;height:26px}
@media (max-width:900px){.chv{grid-template-columns:1fr}}
@media (max-width:520px){.qgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* problem */
.pv{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;align-items:start}
.qcard{padding:18px 20px 20px;display:grid;gap:16px}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qno{font-family:var(--f-display);font-size:24px}
.qno small{font-size:16px;color:var(--ink-2)}
.diff{font-family:var(--f-display);font-size:15px;padding:2px 10px;border-radius:999px;border:2px solid var(--ink);color:#fff}
.diff.d1{background:var(--leaf)}.diff.d2{background:var(--azure)}.diff.d3{background:var(--berry)}.diff.d4{background:#6B4BD8}.diff.d5{background:#D9480F}
.reward{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-family:var(--f-display);font-size:19px}
.qtext{margin:0;font-size:21px;line-height:1.65;text-wrap:pretty}
.statement{font-family:var(--f-display);font-size:24px;line-height:1.5;background:var(--paper-2);border:2.5px dashed var(--ink-2);border-radius:14px;padding:16px 18px;text-align:center}
.banner{background:var(--gold-3);border-radius:12px;padding:8px 12px;font-size:15px}
.expr{display:grid;gap:12px;justify-items:center;padding:18px 10px;background:var(--paper-2);border-radius:16px}
.expr-line{font-family:var(--f-display);font-size:clamp(28px,4.4vw,40px);display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 8px;line-height:1.25;text-align:center;font-variant-numeric:tabular-nums}
.blank{font-family:var(--f-display);font-size:inherit;min-width:2.2em;height:1.55em;padding:0 10px;border:3px dashed var(--ink-2);border-radius:12px;background:#fff;color:var(--azure);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;line-height:1}
.blank.filled{border-style:solid;border-color:var(--ink)}
.blank.on{border-style:solid;border-color:var(--azure);box-shadow:0 0 0 4px var(--azure-2);background:#F5F9FF}
.lbox{display:inline-block;width:.8em;height:.8em;border:2.5px solid currentColor;border-radius:3px;vertical-align:-.08em;margin:0 .08em}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.08;font-size:.7em;margin:0 .1em}
.frac>span:first-child{border-bottom:2.5px solid currentColor;padding:0 .18em}
.mix{display:inline-flex;align-items:center;gap:.04em}
.qtext .frac,.exp .frac,.sum .frac,.hintbox .frac,.mdesc .frac{font-size:.78em}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:72px;border:3px solid var(--ink);border-radius:16px;background:var(--paper);box-shadow:0 4px 0 var(--ink);font-family:var(--f-display);font-size:24px;color:var(--ink);cursor:pointer;text-align:left}
.choice:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.choice .cn{font-size:20px;color:var(--ink-2);flex:none}
.choice.right{background:var(--leaf-2);box-shadow:0 4px 0 var(--ink),inset 0 0 0 3px var(--leaf)}
.choice.wrong{background:var(--berry-2);color:var(--ink-2)}
.choice.wrong .ct{text-decoration:line-through}
.choice:disabled{cursor:default}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.oxb{height:130px;border:3px solid var(--ink);border-radius:20px;background:var(--paper);box-shadow:0 5px 0 var(--ink);cursor:pointer;display:grid;place-items:center}
.oxb svg{width:84px;height:84px}
.oxb:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.oxb.right{background:var(--leaf-2)}
.oxb.wrong{background:var(--berry-2);opacity:.65}
.oxb:disabled{cursor:default}
.hintbox{background:var(--azure-2);border:2.5px dashed var(--azure);border-radius:14px;padding:12px 14px;font-size:18px;line-height:1.6}
.tag{font-family:var(--f-display);font-size:15px;background:var(--ink);color:#fff;border-radius:8px;padding:1px 8px;margin-right:6px}
.fb{border:3px solid var(--ink);border-radius:16px;padding:14px 16px;display:grid;gap:10px;animation:rise .25s ease-out}
.fb.ok{background:var(--leaf-2)}
.fb.no{background:var(--berry-2)}
.fb.sol{background:var(--gold-3)}
.fb.info{background:var(--azure-2);font-size:17px}
.fb-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--f-display);font-size:24px}
.fb-head .ic{width:30px;height:30px}
.gain{display:inline-flex;align-items:center;gap:4px;background:var(--gold);border:2.5px solid var(--ink);border-radius:999px;padding:1px 12px;font-size:20px}
.combo{background:var(--berry);color:#fff;border:2.5px solid var(--ink);border-radius:999px;padding:1px 12px;font-size:17px}
.exp{font-size:18px;line-height:1.65}
.ans{font-family:var(--f-display);font-size:24px}
.side-q{display:grid;gap:14px}
.buddy{display:grid;grid-template-columns:minmax(0,1fr) 118px;align-items:end;gap:8px;padding:12px 12px 0;background:linear-gradient(var(--sky-2),var(--paper));overflow:hidden}
.buddy .hero{width:118px}
.bubble{align-self:center;position:relative;background:#fff;border:2.5px solid var(--ink);border-radius:16px;padding:10px 12px;font-family:var(--f-display);font-size:18px;line-height:1.35;margin-bottom:22px}
.bubble::after{content:"";position:absolute;right:-10px;top:50%;width:16px;height:16px;background:#fff;border-right:2.5px solid var(--ink);border-top:2.5px solid var(--ink);transform:translateY(-50%) rotate(45deg)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px}
.key{height:60px;border:3px solid var(--ink);border-radius:14px;background:#fff;box-shadow:0 4px 0 var(--ink);font-family:var(--f-display);font-size:28px;color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.key.del{background:var(--paper-2)}

const $ = s => document.querySelector(s);

function fmt(s) {
  return esc(s)
    .replace(/\{(\d+)\s+(\d+)\/(\d+)\}/g, '<span class="mix">$1<span class="frac"><span>$2</span><span>$3</span></span></span>')
    .replace(/\{(\d+)\/(\d+)\}/g, '<span class="frac"><span>$1</span><span>$2</span></span>')
    .replace(/□/g, '<span class="lbox" aria-label="네모"></span>');
}
const fmtE = s => fmt(s).replace(/ : /g, ' <span class="colon">:</span> ');
const blankCount = q => (Array.isArray(q.e) ? q.e.join('\n') : (q.e || '')).split('[]').length - 1;
function exprHTML(e, vals, act) {
  const lines = Array.isArray(e) ? e : [e];
  let bi = 0;
  return lines.map(line => {
    const parts = line.split('[]');
    let h = '';
    parts.forEach((p, i) => {
      h += fmtE(p);
      if (i < parts.length - 1) {
        const k = bi++, v = vals[k] || '';
        h += `<button class="blank${k === act ? ' on' : ''}${v ? ' filled' : ''}" data-act="blank" data-i="${k}" aria-label="${k + 1}번째 빈칸${v ? ', ' + esc(v) : ''}">${v ? esc(v) : '&nbsp;'}</button>`;
      }
    });
    return `<div class="expr-line">${h}</div>`;
  }).join('');
}
function answerHTML(q) {
  const t = q.t || 'n';
  if (t === 'c') return fmtE(q.c[q.a]);
  if (t === 'o') return q.a ? 'O (맞음)' : 'X (틀림)';
  const lines = Array.isArray(q.e) ? q.e : [q.e];
  let k = 0;
  return lines.filter(l => l.includes('[]')).map(l => fmtE(l.replace(/\[\]/g, () => String(q.a[k++])))).join('<br>');
}

const rk = (ch, i) => ch + '-' + i;
function rec(ch, i) { const p = P(), k = rk(ch, i); return p.rec[k] || (p.rec[k] = {ok:false, w:0, h:false, sol:false, pts:0}); }
const peek = (ch, i) => P().rec[rk(ch, i)];
function solvedIn(p, ch) { let n = 0; Q[ch].forEach((_, i) => { const r = p.rec[rk(ch, i)]; if (r && r.ok) n++; }); return n; }
const solvedAll = p => CH.reduce((s, c) => s + solvedIn(p, c.n), 0);
function lvInfo(xp) { let lv = 1, acc = 0, need = 60; while (xp >= acc + need) { acc += need; lv++; need += 20; } return {lv, cur:xp - acc, need}; }
function titleOf(lv) { let t = TITLES[0][1]; TITLES.forEach(([l, n]) => { if (lv >= l) t = n; }); return t; }
function meets(p, it) {
  const n = it.need; if (!n) return false;
  if (n.total) return solvedAll(p) >= n.total;
  if (n.ch) return solvedIn(p, n.ch) === Q[n.ch].length;
  if (n.fl) return floorSolved(p, n.fl) === FLOOR;
  if (n.dg) return solvedIn(p, 6) >= n.dg;
  if (n.best) return (p.best || 0) >= n.best;
  return false;
}
function needText(it) { const n = it.need; if (n.total) return `문제 ${n.total}개 해결`; if (n.ch) return `${chOf(n.ch).no || n.ch}차시 모두 해결`; if (n.fl) return `던전 ${n.fl}층 정복`; if (n.dg) return `던전 몬스터 ${n.dg}마리 처치`; return `${n.best}문제 연속 정답`; }
function whyText(it) { const n = it.need; if (n.ch) { const c = chOf(n.ch); return `${c.no || c.n}차시 ${c.t} 정복!`; } if (n.fl) return `던전 ${n.fl}층 ${FLOORS[n.fl - 1].t} 정복!`; return needText(it) + '!'; }
const chReward = n => Object.keys(ITEMS).find(id => ITEMS[id].need && ITEMS[id].need.ch === n);
function rarity(it) {

  if (it.need && it.need.ch) return {k:'legend', n:'전설'};

let AC = null;
function tone(seq) {
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = AC.currentTime;
    seq.forEach(([f, d, st, type = 'triangle', vol = .2]) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t0 + st);
      g.gain.exponentialRampToValueAtTime(vol, t0 + st + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + st + d);
      o.connect(g).connect(AC.destination); o.start(t0 + st); o.stop(t0 + st + d + .05);
    });
  } catch (e) {}
}

}
function floorCard(p, fl) {
  const open = floorOpen(p, fl.f), s = floorSolved(p, fl.f), base = (fl.f - 1) * FLOOR, need = solvedIn(p, fl.ch);
  const rid = Object.keys(ITEMS).find(id => ITEMS[id].need && ITEMS[id].need.fl === fl.f), got = p.owned.includes(rid);
  const cells = Array.from({length:FLOOR}, (_, k) => { const i = base + k, r = p.rec[rk(6, i)], boss = k === FLOOR - 1, ok = r && r.ok; return `<button class="mcell${boss ? ' boss' : ''}${ok ? ' ok' : ''}" data-act="openDQ" data-i="${i}" aria-label="${fl.f}층 ${boss ? '보스' : (k + 1) + '번 몬스터'}${ok ? ', 물리침' : ''}">${monster(fl.c, boss)}<span>${boss ? '보스' : k + 1}</span>${ok ? okBadge : ''}</button>`; }).join('');
  return `<section class="floor${open ? '' : ' shut'}" style="--fc:${fl.c}"><div class="fl-head"><span class="fl-no">${fl.f}층</span><b>${fl.t}</b><span class="fl-s">${open ? `${s} / ${FLOOR}` : `${IC.lockSm}잠김`}</span></div>
<div class="fl-body">${open ? `<div class="mgrid">${cells}</div>` : `<p class="fl-lock">${chOf(fl.ch).no || fl.ch}차시 문제를 ${DG_OPEN}개 풀면 열림 · 지금 ${Math.min(need, DG_OPEN)} / ${DG_OPEN}</p><div class="bar sm"><i style="width:${(Math.min(need / DG_OPEN, 1) * 100).toFixed(1)}%;background:${fl.c}"></i></div>`}
<div class="ch-rw${got ? ' got' : ''}"><span class="rw-thumb${got ? '' : ' locked'}">${thumb(rid)}</span><span><small>${got ? '정복 보상 획득!' : '층을 정복하면 받는 보상'}</small><b>${ITEMS[rid].n}</b></span></div></div></section>`;
}

<section class="side">
<div class="stats"><div class="stat panel">${IC.coin}<div><b>${p.coins}</b><span>코인</span></div></div><div class="stat panel">${IC.check}<div><b>${tot}<small>/${TOTAL}</small></b><span>해결한 문제</span></div></div></div>
${g ? `<div class="goal panel"><div class="goal-thumb">${thumb(gid)}</div><div class="goal-body"><span class="eyebrow">다음 보상</span><b>${g.n}</b><span>문제 ${g.need.total}개를 풀면 받음 · ${g.need.total - tot}개 남음</span><div class="bar sm"><i style="width:${(tot / g.need.total * 100).toFixed(1)}%"></i></div></div></div>` : `<div class="goal panel"><div class="goal-body"><b>모든 업적 보상을 모았음!</b><span>상점과 차시 정복 보상도 확인해 봄.</span></div></div>`}
<div class="menu">

<button class="mbtn dgbtn" data-act="go" data-to="dungeon">${monster('#9B64F2', true, 'mic')}<span><b>비례 던전</b><small>어려운 문제 · 몬스터 50코인, 보스 100코인</small></span></button>
<button class="mbtn" data-act="go" data-to="wardrobe">${IC.shirt}<span><b>장비실</b><small>장비 바꿔 입기</small></span></button>

    return `<div class="wrap chv" style="--cc:${c.c}">
<section class="panel concept"><span class="eyebrow">핵심 정리</span><h2 class="h2">${c.t}</h2><ul class="sum">${c.sum.map(x => `<li>${fmt(x)}</li>`).join('')}</ul>${c.diagram ? termDiagram(c.n === 4) : ''}${c.bar ? barDiagram() : ''}<div class="ex">${c.ex.map(x => `<div class="ex-line">${fmtE(x)}</div>`).join('')}</div></section>

<div class="qgrid">${qs.map((q, i) => { const r = p.rec[rk(c.n, i)]; const st = r && r.ok ? 'ok' : (r && r.sol ? 'sol' : (r && (r.w || r.h) ? 'try' : '')); return `<button class="qcell d${q.d} ${st}" data-act="openQ" data-i="${i}" aria-label="${i + 1}번 문제, ${DIFF[q.d].n}${st === 'ok' ? ', 해결함' : ''}"><span class="qn">${i + 1}</span><span class="qd">${'<i></i>'.repeat(q.d)}</span>${st === 'ok' ? okBadge : ''}</button>`; }).join('')}</div>

<p class="note">노란 칸은 해결한 문제, 분홍 칸은 풀이를 본 문제임. 풀이를 본 문제도 다시 풀면 코인을 조금 받음.</p></section></div>`;
  },

  problem() {
    const p = P(), q = curQ(), r = peek(nav.ch, nav.qi), t = q.t || 'n', done = pv.phase === 'ok' || pv.phase === 'sol';
    const n = qEnd() - qStart(), pot = potential(q, r);
    let body = '';
    if (t === 'o') body = `<div class="statement">${fmt(q.q)}</div><div class="ox">${[true, false].map(v => { const st = done && v === q.a ? ' right' : (pv.wrongOX === v ? ' wrong' : ''); return `<button class="oxb${st}" data-act="ox" data-v="${v ? 1 : 0}" ${done || pv.wrongOX === v ? 'disabled' : ''} aria-label="${v ? '맞음 O' : '틀림 X'}">${v ? IC.O : IC.X}</button>`; }).join('')}</div>`;
    else {
      body = `<p class="qtext">${fmt(q.q || meta(nav.ch).dq)}</p>`;
      if (t === 'n') body += `<div class="expr" id="expr">${exprHTML(q.e, pv.vals, pv.act)}</div>`;
      if (t === 'c') body += `<div class="choices">${pv.order.map((oi, di) => { const st = done && oi === q.a ? ' right' : (pv.wrong.includes(oi) ? ' wrong' : ''); return `<button class="choice${st}" data-act="choice" data-i="${di}" ${done || pv.wrong.includes(oi) ? 'disabled' : ''}><span class="cn">${'①②③④'[di]}</span><span class="ct">${fmtE(q.c[oi])}</span></button>`; }).join('')}</div>`;
    }
    const hint = pv.showHint && !done && pv.phase !== 'retry' ? `<div class="hintbox"><span class="tag">힌트</span>${fmt(q.h)}</div>` : '';
    const sideHint = !done && !pv.showHint && !(r && r.ok) ? `<button class="btn wide" data-act="hint">힌트 보기 <small>(받는 코인 절반)</small></button>` : '';
    return `<div class="wrap pv">
<section class="panel qcard" id="qcard"><div class="qhead">${nav.ch === 6 ? monster(FLOORS[floorOf(nav.qi) - 1].c, q.d === 5, 'qmon') : ''}<span class="qno">문제 ${nav.qi - qStart() + 1}<small> / ${n}</small></span><span class="diff d${q.d}">${DIFF[q.d].n}</span><span class="reward">${r && r.ok ? '복습' : `${IC.coin}+${pot}`}</span></div>
${r && r.ok && !done ? `<div class="banner">이미 해결한 문제임. 다시 풀어도 코인은 없음.</div>` : ''}
${body}${hint}${feedback(q)}</section>
<aside class="side-q"><div class="buddy panel"><div class="bubble">${buddyLine()}</div>${hero(p.eq, {...look(p), mood:pv.phase === 'ok' ? 'joy' : (pv.phase === 'retry' || pv.phase === 'sol' ? 'sad' : 'happy'), cls:pv.phase === 'ok' ? 'jump' : ''})}</div>
${t === 'n' && !done ? padHTML(blankCount(q)) : ''}${sideHint}</aside></div>`;

  wardrobe() {

    const stage = `<section class="panel stage"><div class="stage-sky">${hero(p.eq, {...look(p), label:p.name})}</div><div class="eq-list">${SLOTS.map(s => `<div class="eq-row"><span class="eq-slot">${s.n}</span><span class="eq-name">${p.eq[s.id] ? ITEMS[p.eq[s.id]].n : '없음'}</span></div>`).join('')}</div></section>`;
    if (slot === 'look') return `<div class="wrap two">${stage}<section class="inv">${tabs}
<div class="panel look"><div class="lbl">성별</div><div class="look-g">${[['m', '남자 용사'], ['f', '여자 용사']].map(([g, n]) => `<button class="item${gd === g ? ' equipped' : ''}" data-act="setGender" data-g="${g}"><span class="ithumb">${hero({}, {hair:hairC(p.hair), gender:g, vb:'50 18 140 152', cls:'clip', label:n})}</span><b>${n}</b><span class="ichip">${gd === g ? '선택됨' : '바꾸기'}</span></button>`).join('')}</div>

<p class="note">외모는 언제든 바꿀 수 있고, 모은 장비와 기록은 그대로 남음.</p></div></section></div>`;

  records() {
    const p = P(), L = lvInfo(p.xp);

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function openQ(i) {
  nav = {v:'problem', ch:nav.ch, qi:i};
  const q = curQ(), r = peek(nav.ch, i);
  pv = {vals:[], act:0, phase:'ask', tries:0, wrong:[], wrongOX:null, showHint:!!(r && r.h && !r.ok), msg:'', review:false, gain:0, comboTxt:'', order:q.c ? shuffle(q.c.map((_, k) => k)) : []};

}
function updExpr() {

function press(k) {
  if (!pv || pv.phase === 'ok' || pv.phase === 'sol') return;
  let v = pv.vals[pv.act] || '';
  if (k === 'del') v = v.slice(0, -1);
  else if (k === '.') { if (!v.includes('.')) v = (v || '0') + '.'; }
  else if (v.length < 7) v = (v === '0' ? '' : v) + k;
  pv.vals[pv.act] = v;
  updExpr();
}
const near = (a, b) => Math.abs(a - b) < 1e-9;
function checkAns() {
  if (!pv || pv.phase === 'ok' || pv.phase === 'sol') return;
  const q = curQ(), nb = blankCount(q), vals = [];
  for (let i = 0; i < nb; i++) vals.push(pv.vals[i] || '');
  const empty = vals.findIndex(v => !v || v === '.' || v === '0.');
  if (empty >= 0) { pv.act = empty; pv.msg = '빈칸을 모두 채운 뒤 확인을 누름.'; render(); return; }
  const nums = vals.map(Number);
  if (q.a.every((a, i) => near(a, nums[i]))) return correct();
  if (q.s && nb === 2 && nums.every(x => x > 0) && near(nums[0] * q.a[1], nums[1] * q.a[0])) {
    pv.msg = '비율은 같지만 가장 간단한 자연수의 비가 아님. 더 간단하게 만들어 봄!';
    SFX.tap(); render(); return;
  }
  wrong();
}
function pickChoice(di) {
  if (!pv || pv.phase === 'ok' || pv.phase === 'sol') return;
  const q = curQ(), oi = pv.order[di];
  if (oi === undefined || pv.wrong.includes(oi)) return;
  if (oi === q.a) correct(); else { pv.wrong.push(oi); wrong(); }
}
function pickOX(v) {
  if (!pv || pv.phase === 'ok' || pv.phase === 'sol') return;
  if (v === curQ().a) correct(); else { pv.wrongOX = v; wrong(); }
}
function correct() {
  const q = curQ(), p = P(), r = rec(nav.ch, nav.qi);
  pv.phase = 'ok'; pv.msg = '';
  SFX.ok();
  if (r.ok) { pv.review = true; pv.gain = 0; pv.comboTxt = ''; render(); scrollFb(); return; }
  const clean = !r.sol && r.w === 0 && !r.h;
  let g = potential(q, r);
  combo = clean ? combo + 1 : 0;
  if (combo >= 3) { g += 5; pv.comboTxt = `${combo}연속 정답 +5`; } else pv.comboTxt = '';
  if (combo > p.best) p.best = combo;
  const before = lvInfo(p.xp).lv;
  r.ok = true; r.pts = g; p.coins += g; p.xp += g; pv.gain = g;
  if (nav.ch === 6) { const f = floorOf(nav.qi); if (floorSolved(p, f) === FLOOR) { p.coins += FLOOR_BONUS; p.xp += FLOOR_BONUS; modalQ.push({type:'floor', f}); } }
  const after = lvInfo(p.xp).lv;
  if (after > before) modalQ.push({type:'level', lv:after, title:titleOf(after) !== titleOf(before) ? titleOf(after) : null});
  checkUnlocks();
  save(); render(); scrollFb(); floatCoin(g);
  setTimeout(showModal, 950);
}
function wrong() {
  const q = curQ(), r = rec(nav.ch, nav.qi);

  else { pv.phase = 'retry'; pv.showHint = true; }
  pv.msg = '';

}

  go: d => go(d.to),
  back: () => goBack(),
  sound: () => { S.sound = !S.sound; save(); renderTop(); SFX.tap(); },
  pickHero: d => { S.cur = d.id; combo = 0; save(); go('home'); },
  newHero: () => { ui.newForm = true; ui.newName = ''; render(); const i = $('#heroName'); if (i) i.focus(); },
  cancelNew: () => { ui.newForm = false; render(); },
  hair: d => { ui.newHair = d.id; SFX.tap(); render(); },
  gender: d => { ui.newGender = d.g; SFX.tap(); render(); },
  setGender: d => { P().gender = d.g; SFX.tap(); save(); render(); },
  setHair: d => { P().hair = d.id; SFX.tap(); save(); render(); },
  pickNum: d => { ui.lNum = +d.n; ui.lMsg = ''; SFX.tap(); render(); const i = $(ui.lName ? '#lgPin' : '#lgName'); if (i) i.focus(); },
  login: () => login(),
  createCloud: () => createCloud(),
  cancelPend: () => { ui.pend = null; render(); },
  logout: () => logout(),
  retry: () => connect(),
  tLogin: () => { const i = $('#tgPw'); if (!i || i.value !== TEACHER_PW) { const m = $('#tgMsg'); if (m) m.textContent = '비밀번호가 맞지 않음'; return; } ui.tOK = true; startTeacher(); render(); },
  tPin: () => { ui.tPin = !ui.tPin; render(); },
  tDelAsk: d => { ui.tDel = +d.n; render(); },
  tDelNo: () => { ui.tDel = null; render(); },
  tDelYes: d => { const n = +d.n; ui.tDel = null; FB.api.del('n' + n).then(() => toast(`${n}번 기록을 삭제했음`)).catch(() => toast('삭제하지 못함')); delete S.P[cid(n)]; localSave(); render(); },
  csv: () => downloadCSV(),
  createHero: () => createHero(),
  openCh: d => { nav = {v:'chapter', ch:+d.ch}; render(true); },
  openQ: d => openQ(+d.i),
  openDQ: d => { const i = +d.i, f = floorOf(i); if (!floorOpen(P(), f)) { toast(`${chOf(FLOORS[f - 1].ch).no || FLOORS[f - 1].ch}차시 문제를 ${DG_OPEN}개 풀면 열림`); return; } nav.ch = 6; openQ(i); },
  cont: () => { const p = P(), n = Q[nav.ch].length; let i = 0; while (i < n && p.rec[rk(nav.ch, i)] && p.rec[rk(nav.ch, i)].ok) i++; openQ(i < n ? i : 0); },
  blank: d => { pv.act = +d.i; updExpr(); },
  key: d => press(d.k),
  nextBlank: () => { pv.act = (pv.act + 1) % blankCount(curQ()); updExpr(); },
  check: () => checkAns(),
  choice: d => pickChoice(+d.i),
  ox: d => pickOX(d.v === '1'),
  hint: () => { const r = rec(nav.ch, nav.qi); if (!r.ok) r.h = true; pv.showHint = true; save(); render(); },
  nextQ: () => { if (nav.qi < qEnd() - 1) openQ(nav.qi + 1); else ACT.toList(); },
  retryQ: () => openQ(nav.qi),
  toList: () => { nav = nav.ch === 6 ? {v:'dungeon', ch:6} : {v:'chapter', ch:nav.ch}; render(true); },
  wtab: d => { ui.wTab = d.slot; render(); },
  stab: d => { ui.sTab = d.slot; render(); },
  equip: d => { const p = P(), it = ITEMS[d.id]; if (!it || !p.owned.includes(d.id)) return; p.eq[it.slot] = p.eq[it.slot] === d.id ? null : d.id; SFX.tap(); save(); render(); },
  unequip: d => { P().eq[d.slot] = null; SFX.tap(); save(); render(); },
  toShop: d => { ui.sSel = d.id; ui.sTab = 'all'; go('shop'); },
  lockedInfo: d => toast(`${needText(ITEMS[d.id])} 시 열림`),
  selItem: d => { ui.sSel = d.id; ui.buyAsk = false; SFX.tap(); render(); },
  buy: () => { ui.buyAsk = true; render(); },
  buyNo: () => { ui.buyAsk = false; render(); },
  buyYes: () => {
    const p = P(), id = ui.sSel, it = ITEMS[id];
    if (!it || p.owned.includes(id) || p.coins < it.price) { ui.buyAsk = false; render(); return; }
    p.coins -= it.price; p.owned.push(id); p.eq[it.slot] = id; ui.buyAsk = false;
    save(); SFX.coin(); render(); toast(`${it.n} 구매 완료! 바로 착용했음.`);
  },
  mEquip: d => { const p = P(), it = ITEMS[d.id]; if (p && it) { p.eq[it.slot] = d.id; save(); } closeModal(); render(); },
  mClose: () => closeModal(),
  delAsk: () => { ui.delAsk = true; render(); const i = $('#tpw'); if (i) i.focus(); },
  delNo: () => { ui.delAsk = false; render(); },
  delYes: () => {
    const i = $('#tpw');
    if (!i || i.value !== TEACHER_PW) { toast('비밀번호가 맞지 않음'); return; }
    const id = S.cur, dp = P(); if (dp && dp.cloud && FB.state === 'on') FB.api.del('n' + dp.num).catch(() => {});
    delete S.P[id]; S.order = S.order.filter(x => x !== id); S.cur = null;
    ui.delAsk = false; save(); toast('용사를 삭제했음'); go('title');
  }
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const fn = ACT[b.dataset.act];
  if (fn) fn(b.dataset, b);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'heroName') ui.newName = t.value;
  else if (t.id === 'lgName') ui.lName = t.value;
  else if (t.id === 'lgPin') { const v = t.value.replace(/\D/g, '').slice(0, 4); if (v !== t.value) t.value = v; ui.lPin = v; }
});
document.addEventListener('keydown', e => {
  const box = $('#modal');
  if (!box.hidden) { if (e.key === 'Escape') { e.preventDefault(); closeModal(); } return; }
  if (e.target.id === 'heroName' && e.key === 'Enter') { e.preventDefault(); createHero(); return; }
  if (e.target.id === 'tpw' && e.key === 'Enter') { e.preventDefault(); ACT.delYes(); return; }
  if (e.target.id === 'lgName' && e.key === 'Enter') { e.preventDefault(); const pi = $('#lgPin'); if (pi) pi.focus(); return; }
  if (e.target.id === 'lgPin' && e.key === 'Enter') { e.preventDefault(); login(); return; }
  if (e.target.id === 'tgPw' && e.key === 'Enter') { e.preventDefault(); ACT.tLogin(); return; }
  if (e.target.tagName === 'INPUT' || nav.v !== 'problem' || !pv) return;
  if (e.target.tagName === 'BUTTON' && (e.key === 'Enter' || e.key === ' ')) return;
  const q = curQ(), t = q.t || 'n';
  if (pv.phase === 'ok' || pv.phase === 'sol') { if (e.key === 'Enter') { e.preventDefault(); ACT.nextQ(); } return; }
  if (t === 'n') {
    if (/^[0-9]$/.test(e.key)) press(e.key);
    else if (e.key === '.') press('.');
    else if (e.key === 'Backspace') { e.preventDefault(); press('del'); }
    else if (e.key === 'Enter') { e.preventDefault(); checkAns(); }
    else if (e.key === 'Tab' || e.key === 'ArrowRight') { if (blankCount(q) > 1) { e.preventDefault(); ACT.nextBlank(); } }
    else if (e.key === 'ArrowLeft') { const nb = blankCount(q); if (nb > 1) { e.preventDefault(); pv.act = (pv.act - 1 + nb) % nb; updExpr(); } }
  } else if (t === 'c' && /^[1-4]$/.test(e.key)) pickChoice(+e.key - 1);
  else if (t === 'o' && (e.key === 'o' || e.key === 'O' || e.key === 'x' || e.key === 'X')) pickOX(e.key.toLowerCase() === 'o');
});

/* ---------- 시작 ---------- */
(function init() {
  if (S.cur && !S.P[S.cur]) S.cur = null;
  if (S.last) { ui.lNum = S.last.num; ui.lName = S.last.name; }
  if (P() && P().cloud) S.cur = null;
  if (P()) nav = {v:'home', ch:1};
  render(true);
  connect();
  window.addEventListener('online', () => { if (FB.state === 'off' && FB.err !== 'perm') connect(); else pushCloud(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) pushCloud(); });
})();
</script>

</html>
